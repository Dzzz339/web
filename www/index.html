<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="js/mobile-bridge.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockeasy</title>
  
  <!-- ИКОНКА ДЛЯ ВКЛАДКИ БРАУЗЕРА И ТЕЛЕФОНА -->
  <link rel="icon" type="image/x-icon" href="images/logo.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="images/logo.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://app.stockeasy.ru/socket.io/socket.io.js" onerror="console.warn('Socket.io unavailable in offline')"></script>
  <link rel="stylesheet" href="css/style.css?v=2.1" />
  <script src="xlsx.full.min.js"></script>
</head>
<body>
<div class="app-layout" id="app-layout">
  <!-- Оверлей для мобильного сайдбара -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleMobileSidebar(false)"></div>

  <!-- БОКОВОЙ САЙДБАР -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" id="sidebar-logo" onclick="handleLogoClick()" title="Stockeasy">
        <div class="sidebar-logo-icon-wrap">
          <img src="images/logo.ico" alt="" onerror="this.style.display='none'">
          <div class="sidebar-logo-hint">▶</div>
        </div>
        <span class="logo-text">Stockeasy</span>
      </div>
      <button type="button" class="sidebar-collapse-btn" id="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" title="Свернуть меню">
        <span id="collapse-icon">◀</span>
      </button>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav"></nav>

    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <!-- ОСНОВНАЯ ОБЛАСТЬ -->
  <div class="content-wrapper">
    <!-- Имитация верхней системной строки телефона (Status Bar) для предпросмотра -->
    <div class="sim-phone-header" id="sim-phone-header">
      <span class="sim-time" id="sim-clock">14:52</span>
      <div class="sim-notch"></div>
      <div class="sim-indicators" style="display:flex; align-items:center; gap:6px;">
        <span style="font-size:10px; font-weight:700; letter-spacing:0.5px;">5G</span>
        <!-- Строгий индикатор сигнала связи -->
        <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor" style="display:inline-block;"><rect x="1" y="9" width="2" height="3" rx="0.5"/><rect x="5" y="6" width="2" height="6" rx="0.5"/><rect x="9" y="3" width="2" height="9" rx="0.5"/><rect x="13" y="0" width="2" height="12" rx="0.5"/></svg>
        <!-- Строгий индикатор батареи -->
        <svg width="22" height="11" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:inline-block;"><rect x="1" y="1" width="19" height="10" rx="2.5"/><rect x="3" y="3" width="12" height="6" rx="1" fill="currentColor"/><path d="M22 4v4"/></svg>
      </div>
    </div>

    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button type="button" class="topbar-menu-btn" onclick="toggleMobileSidebar(true)" title="Меню">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title" id="topbar-title">Заявки</div>
      </div>
      
      <div class="topbar-right">
        <!-- Кнопка обновления приложения при новом пуше в Git -->
        <div id="update-btn-container"></div>

        <!-- Статус сети / оффлайн индикатор -->
        <div id="network-status-pill" style="display:none; align-items:center; gap:6px; font-size:.78rem; font-weight:600; padding:4px 10px; border-radius:12px; background:rgba(34,197,94,0.12); color:#16a34a; margin-right:8px; cursor:pointer;" onclick="manualSync()" title="Нажмите для проверки связи и ручной синхронизации">
          <span id="network-status-dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#16a34a;"></span>
          <span id="network-status-text">Онлайн</span>
        </div>

        <!-- Колокольчик с красным бейджем -->
        <div id="notif-container" style="position:relative; display:none;">
          <button id="notif-btn" onclick="toggleNotifications()" class="topbar-icon-btn" title="Уведомления">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="notif-badge" class="notif-badge" style="display:none;">0</span>
          </button>
          
          <!-- Выпадающее окно с уведомлениями -->
          <div id="notif-dropdown" class="notif-dropdown" style="display:none;">
            <div class="notif-dropdown-header">
              <span>Уведомления</span>
              <button onclick="markNotifsRead()" class="btn-link" style="font-size:.75rem">Прочитать все</button>
            </div>
            <div id="notif-list" style="font-size:.8rem"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- Предупреждающий баннер при оффлайн режиме или наличии неотправленных изменений -->
    <div id="offline-banner" style="display:none; padding:10px 16px; background:#fffbeb; border-bottom:1px solid #fef3c7; color:#b45309; font-size:.82rem; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:1.1rem;">⚡</span>
        <span id="offline-banner-text"><strong>Автономный режим:</strong> Связь с сервером прервана. Вы можете продолжать работу — все действия сохраняются на устройстве и отправятся автоматически.</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span id="outbox-badge" style="display:none; background:#f59e0b; color:#fff; font-size:.72rem; font-weight:bold; padding:2px 8px; border-radius:10px;">0 в очереди</span>
        <button type="button" class="btn btn-sm" onclick="manualSync()" style="background:#fef3c7; color:#92400e; border:1px solid #fde68a; font-size:.75rem; padding:4px 10px; cursor:pointer; font-weight:600;">🔄 Синхронизировать сейчас</button>
      </div>
    </div>

    <main class="main" id="app"></main>

    <!-- МОБИЛЬНЫЙ НАВБАР ВНИЗУ ЭКРАНА СМАРТФОНА (BOTTOM NAVIGATION) -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
      <button type="button" class="mob-nav-item active" onclick="go('dashboard')" data-tab="dashboard">
        <span class="mob-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        </span>
        <span class="mob-nav-label">Обзор</span>
      </button>
      <button type="button" class="mob-nav-item" onclick="go('tasks')" data-tab="tasks">
        <span class="mob-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg>
        </span>
        <span class="mob-nav-label">Заявки</span>
      </button>
      <button type="button" class="mob-nav-item" onclick="go('supply')" data-tab="supply">
        <span class="mob-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        </span>
        <span class="mob-nav-label">Склад</span>
      </button>
      <button type="button" class="mob-nav-item" onclick="go('chat')" data-tab="chat">
        <span class="mob-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </span>
        <span class="mob-nav-label">Чат</span>
      </button>
      <button type="button" class="mob-nav-item" onclick="go('profile')" data-tab="profile">
        <span class="mob-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4.5"/><path d="M5.5 20.5a6.5 6.5 0 0 1 13 0"/></svg>
        </span>
        <span class="mob-nav-label">Профиль</span>
      </button>
    </nav>
  </div>
</div>

  <!-- МОДУЛЬНАЯ АРХИТЕКТУРА JAVASCRIPT (с версионированием кэша) -->
  <script src="js/state.js?v=3.0"></script>
  <script src="js/helpers.js?v=3.0"></script>
  <script src="js/hints.js?v=2.1"></script>
  <script src="js/windowManager.js?v=2.4"></script>
  <script src="js/offline.js?v=2.5"></script>
  <script src="js/api.js?v=2.5"></script>
  <script src="js/pages/dashboard.js?v=2.5"></script>
  <script src="js/pages/tasks.js?v=3.0"></script>
  <script src="js/pages/kanban.js?v=2.5"></script>
  <script src="js/subcontractWizard.js?v=3.0"></script>
  <script src="js/pages/card.js?v=4.5"></script>
  <script src="js/idModeration.js?v=1.5"></script>
  <script src="js/pages/marches.js?v=2.5"></script>
  <script src="js/pages/contracts.js?v=3.5"></script>
  <script src="js/pages/subcontracts.js?v=2.0"></script>
  <script src="js/pages/contractors.js?v=4.0"></script>
  <script src="js/documentEditor.js?v=2.0"></script>
  <script src="js/pages/templates.js?v=2.0"></script>
  <script src="js/pages/users.js?v=3.0"></script>
  <script src="js/pages/data.js?v=2.5"></script>
  <script src="js/pages/chat.js?v=2.5"></script>
  <script src="js/pages/profile.js?v=2.5"></script>
  <script src="js/pages/supply.js?v=2.5"></script>
  <script src="js/pages/logs.js?v=2.5"></script>
  <script src="js/pages/help.js?v=2.5"></script>
  <script src="js/app.js?v=3.0"></script>
  <script src="js/updater.js?v=1.0"></script>
</body>
</html>
