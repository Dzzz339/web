function pageDash(subSection) {
  subSection = subSection || (S.page.startsWith('dash-') ? S.page.replace('dash-', '') : 'summary');

  var s = S.stats;
  var total   = s.tasks   && s.tasks.total    || 0;
  var done    = s.tasks   && s.tasks.done     || 0;
  var pend    = s.tasks   && s.tasks.pending  || 0;
  var overdue = s.supply  && s.supply.overdue || 0;
  var revenue = s.revenue && s.revenue.total  || 0;

  // 1. ПОДРАЗДЕЛ: ЗАКАЗЧИКИ
  if (subSection === 'customers') {
    var custMap = {};
    S.tasks.forEach(function(t) {
      var c = t.customer || 'ПАО Сбербанк';
      if (!custMap[c]) custMap[c] = { name: c, total: 0, done: 0, overdue: 0, inWork: 0, amount: 0 };
      custMap[c].total++;
      if (t.status === 'done') custMap[c].done++;
      else custMap[c].inWork++;
      if (t.overdueDays > 0) custMap[c].overdue++;
      custMap[c].amount += Number(t.amount || 0);
    });
    var custList = Object.values(custMap).sort(function(a,b){ return b.total - a.total; });

    var cardsHtml = custList.map(function(c) {
      var p = pct(c.done, c.total);
      return `
        <div class="card p" style="cursor:pointer; transition:transform 0.12s, box-shadow 0.12s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'" onclick="filterAndGoTasks({customer:'${escHtml(c.name)}'})">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.75rem">
            <div>
              <span class="badge b-customer" style="margin-bottom:4px; display:inline-block">Заказчик</span>
              <div style="font-weight:700; font-size:1.1rem">${escHtml(c.name)}</div>
            </div>
            <div style="font-weight:700; font-size:1.15rem; color:var(--blue)">${fmtMoney(c.amount)}</div>
          </div>
          <div class="g3 mb" style="gap:.5rem; font-size:.85rem">
            <div style="background:var(--bg); padding:6px 8px; border-radius:6px">Всего: <b>${fmtN(c.total)}</b></div>
            <div style="background:var(--bg); padding:6px 8px; border-radius:6px; color:var(--green)">Готово: <b>${fmtN(c.done)}</b></div>
            <div style="background:var(--bg); padding:6px 8px; border-radius:6px; color:${c.overdue>0?'var(--red)':'var(--text-3)'}">Просрочено: <b>${fmtN(c.overdue)}</b></div>
          </div>
          ${bar(c.done, c.total)}
          <div style="text-align:right; font-size:.75rem; color:var(--text-3); margin-top:4px">${p}% завершено (клик для перехода к заявкам) ➔</div>
        </div>
      `;
    }).join('');

    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
        <h1 class="page-title" style="margin:0">Аналитика: Заказчики</h1>
        <button class="btn btn-sm btn-ghost" onclick="go('dashboard')">← Назад в Обзор</button>
      </div>
      <p class="t3 mb" style="font-size:.85rem">Срез выполнения работ и объёмов в разрезе генеральных заказчиков.</p>
      <div class="g2" style="gap:1rem">${cardsHtml || '<div class="card p t3">Нет данных</div>'}</div>
    `;
  }

  // 2. ПОДРАЗДЕЛ: ИСПОЛНИТЕЛИ
  if (subSection === 'executors') {
    var execMap = {};
    S.tasks.forEach(function(t) {
      var e = t.assignee || t.contractor || 'Не назначен';
      if (!execMap[e]) execMap[e] = { name: e, total: 0, done: 0, inWork: 0, overdue: 0, pay: 0, ports: 0 };
      execMap[e].total++;
      if (t.status === 'done') execMap[e].done++;
      else execMap[e].inWork++;
      if (t.overdueDays > 0) execMap[e].overdue++;
      execMap[e].ports += (t.fact || t.inOrder || 0);

      var f = getTaskFinance(t);
      execMap[e].pay += f.po;
    });
    var execList = Object.values(execMap).sort(function(a,b){ return b.total - a.total; });

    var execRows = execList.map(function(e) {
      return `
        <tr style="cursor:pointer" onclick="filterAndGoTasks({q:'${escHtml(e.name)}'})" title="Перейти к заявкам исполнителя">
          <td style="padding:10px 12px; font-weight:600">${escHtml(e.name)}</td>
          <td style="padding:10px 12px; text-align:right; font-weight:600">${fmtN(e.total)}</td>
          <td style="padding:10px 12px; text-align:right; color:var(--green)">${fmtN(e.done)}</td>
          <td style="padding:10px 12px; text-align:right; color:var(--orange)">${fmtN(e.inWork)}</td>
          <td style="padding:10px 12px; text-align:right; color:${e.overdue>0?'var(--red)':'var(--text-3)'}"><b>${fmtN(e.overdue)}</b></td>
          <td style="padding:10px 12px; text-align:right">${fmtN(e.ports)}</td>
          <td style="padding:10px 12px; text-align:right; font-weight:700; color:var(--orange)">${fmtMoney(e.pay)}</td>
        </tr>
      `;
    }).join('');

    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
        <h1 class="page-title" style="margin:0">Аналитика: Исполнители</h1>
        <button class="btn btn-sm btn-ghost" onclick="go('dashboard')">← Назад в Обзор</button>
      </div>
      <div class="card tbl-wrap">
        <table>
          <thead>
            <tr style="background:var(--bg)">
              <th>Исполнитель / Подрядчик</th>
              <th style="text-align:right">Заявок</th>
              <th style="text-align:right">Готово</th>
              <th style="text-align:right">В работе</th>
              <th style="text-align:right">Просрочено</th>
              <th style="text-align:right">Портов</th>
              <th style="text-align:right">К выплате (ПО)</th>
            </tr>
          </thead>
          <tbody>${execRows}</tbody>
        </table>
      </div>
    `;
  }

  // 3. ПОДРАЗДЕЛ: ОПЛАТЫ НАМ VS ОПЛАТЫ НАШИ
  if (subSection === 'payments-in' || subSection === 'payments-out') {
    var isIncoming = subSection === 'payments-in';
    var title = isIncoming ? 'Оплаты нам (Дебиторка от Заказчиков)' : 'Оплаты наши (Выплаты Исполнителям)';
    
    var totalSum = 0;
    var paidSum = 0;
    S.tasks.forEach(function(t) {
      if (isIncoming) {
        totalSum += Number(t.amount || 0);
        if (t.status === 'done' && (t.oplata || '').toLowerCase().includes('оплач')) {
          paidSum += Number(t.amount || 0);
        }
      } else {
        var f = getTaskFinance(t);
        totalSum += f.po;
        if ((t.oplata || '').toLowerCase().includes('оплач')) {
          paidSum += f.po;
        }
      }
    });

    var debt = Math.max(0, totalSum - paidSum);

    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
        <h1 class="page-title" style="margin:0">${title}</h1>
        <button class="btn btn-sm btn-ghost" onclick="go('dashboard')">← Назад в Обзор</button>
      </div>
      <div class="g3 mb">
        <div class="card stat"><div class="stat-lbl">Общая сумма</div><div class="stat-val">${fmtMoney(totalSum)}</div></div>
        <div class="card stat"><div class="stat-lbl">Оплачено</div><div class="stat-val" style="color:var(--green)">${fmtMoney(paidSum)}</div></div>
        <div class="card stat"><div class="stat-lbl">Остаток к ${isIncoming?'получению':'выплате'}</div><div class="stat-val" style="color:var(--orange)">${fmtMoney(debt)}</div></div>
      </div>
      <div class="card p" style="text-align:center; padding:2rem">
        <button class="btn" onclick="filterAndGoTasks({st:'done'})">Перейти к выполненным заявкам с расчетами ➔</button>
      </div>
    `;
  }

  // 4. ПОДРАЗДЕЛ: МАТЕРИАЛЫ
  if (subSection === 'materials') {
    var totalTmc = S.tasks.reduce(function(acc, t){ return acc + (t.tmc || 0); }, 0);
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
        <h1 class="page-title" style="margin:0">Аналитика: Материалы (ТМЦ)</h1>
        <button class="btn btn-sm btn-ghost" onclick="go('dashboard')">← Назад в Обзор</button>
      </div>
      <div class="g3 mb">
        <div class="card stat"><div class="stat-lbl">Общая сумма ТМЦ в заявках</div><div class="stat-val" style="color:var(--blue)">${fmtMoney(totalTmc)}</div></div>
      </div>
      <div id="checklists_summary_box" class="card p mb">
        <div class="sec-title">Потребность по чек-листам обследования</div>
        <div class="t3">Загрузка данных обследований…</div>
      </div>
    `;
  }

  // 5. ПОДРАЗДЕЛ: КАЛЕНДАРЬ
  if (subSection === 'calendar') {
    var calMap = {};
    S.tasks.forEach(function(t) {
      if (!t.deadline) return;
      var m = t.deadline.slice(0,7);
      if (!calMap[m]) calMap[m] = { month: m, total: 0, done: 0, overdue: 0 };
      calMap[m].total++;
      if (t.status === 'done') calMap[m].done++;
      if (t.overdueDays > 0) calMap[m].overdue++;
    });
    var calList = Object.values(calMap).sort(function(a,b){ return a.month.localeCompare(b.month); });

    var calRows = calList.map(function(c) {
      return `
        <tr style="cursor:pointer" onclick="filterAndGoTasks({q:'${c.month}'})" title="Перейти к заявкам за ${c.month}">
          <td style="padding:10px 12px; font-weight:600">📅 ${c.month}</td>
          <td style="padding:10px 12px; text-align:right"><b>${fmtN(c.total)}</b></td>
          <td style="padding:10px 12px; text-align:right; color:var(--green)">${fmtN(c.done)}</td>
          <td style="padding:10px 12px; text-align:right; color:${c.overdue>0?'var(--red)':'var(--text-3)'}"><b>${fmtN(c.overdue)}</b></td>
          <td style="padding:10px 12px">${bar(c.done, c.total)}</td>
        </tr>
      `;
    }).join('');

    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
        <h1 class="page-title" style="margin:0">Календарь дедлайнов</h1>
        <button class="btn btn-sm btn-ghost" onclick="go('dashboard')">← Назад в Обзор</button>
      </div>
      <div class="card tbl-wrap">
        <table>
          <thead><tr style="background:var(--bg)"><th>Месяц</th><th style="text-align:right">Всего заявок</th><th style="text-align:right">Выполнено</th><th style="text-align:right">Просрочено</th><th>Прогресс</th></tr></thead>
          <tbody>${calRows || '<tr><td colspan="5" style="text-align:center;padding:2rem">Нет данных по дедлайнам</td></tr>'}</tbody>
        </table>
      </div>
    `;
  }

  // 0. ГЛАВНАЯ СВОДКА ОБЗОРА (С ИНТЕРАКТИВНЫМИ ПЛИТКАМИ DRILL-DOWN)
  var top = '';
  var chainsArray = Array.isArray(S.chains) ? S.chains : [];
  var topChains = chainsArray.slice().sort(function(a,b){ return b.totalTasks - a.totalTasks; }).slice(0,8);
  topChains.forEach(function(c) {
    var cp = pct(c.doneTasks, c.totalTasks);
    top += '<div style="margin-bottom:.6rem; cursor:pointer; padding:4px 6px; border-radius:6px" onmouseover="this.style.background=\'var(--orange-bg)\'" onmouseout="this.style.background=\'none\'" onclick="filterAndGoTasks({reg:\'' + escHtml(c.id) + '\'})" title="Перейти к заявкам региона ' + escHtml(c.id) + '">' +
      '<div class="row" style="justify-content:space-between;margin-bottom:3px">' +
        '<span class="fw6" style="font-size:.82rem">📍 ' + c.id + ' <span style="font-size:.7rem; color:var(--orange)">➔</span></span>' +
        '<span class="t3" style="font-size:.75rem">' + c.doneTasks + '/' + c.totalTasks + ' · ' + cp + '% · ' + fmtMoney(c.totalAmount) + '</span>' +
      '</div>' + bar(c.doneTasks, c.totalTasks) + '</div>';
  });

  return '<h1 class="page-title">Дашборд</h1>' +
    importBanner() +
    '<div class="g4">' +
      // ПЛИТКА 1: Всего заявок (Интерактивная)
      '<div class="card stat" style="cursor:pointer; transition:transform 0.12s;" onmouseover="this.style.transform=\'translateY(-2px)\'" onmouseout="this.style.transform=\'none\'" onclick="filterAndGoTasks({})" title="Перейти ко всем заявкам">' +
        '<div class="stat-lbl">Всего заявок ➔</div><div class="stat-val">' + fmtN(total) + '</div>' +
        '<div class="stat-sub">✓ Готово: <strong>' + fmtN(done) + '</strong> · ⏳ В работе: <strong>' + fmtN(pend) + '</strong></div>' +
        bar(done, total) + '</div>' +

      // ПЛИТКА 2: Просрочено (Интерактивная)
      '<div class="card stat" style="cursor:pointer; transition:transform 0.12s;" onmouseover="this.style.transform=\'translateY(-2px)\'" onmouseout="this.style.transform=\'none\'" onclick="filterAndGoTasks({ovd:\'yes\'})" title="Показать только просроченные заявки">' +
        '<div class="stat-lbl">Просрочено ➔</div><div class="stat-val" style="color:' + (overdue>0?'var(--red)':'var(--green)') + '">' + fmtN(overdue) + '</div>' +
        '<div class="stat-sub">заявок с превышением срока (клик для отбора)</div></div>' +

      // ПЛИТКА 3: Регионы / цепи (Интерактивная)
      '<div class="card stat" style="cursor:pointer; transition:transform 0.12s;" onmouseover="this.style.transform=\'translateY(-2px)\'" onmouseout="this.style.transform=\'none\'" onclick="go(\'supply\')" title="Перейти в цепочки">' +
        '<div class="stat-lbl">Регионы / цепи ➔</div><div class="stat-val">' + S.chains.length + '</div>' +
        '<div class="stat-sub">✓ Завершено: <strong>' + S.chains.filter(function(c){return c.status==='completed';}).length + '</strong></div></div>' +

      // ПЛИТКА 4: Сумма договоров (Интерактивная)
      '<div class="card stat" style="cursor:pointer; transition:transform 0.12s;" onmouseover="this.style.transform=\'translateY(-2px)\'" onmouseout="this.style.transform=\'none\'" onclick="go(\'dash-customers\')" title="Посмотреть разбивку по заказчикам">' +
        '<div class="stat-lbl">Сумма договоров ➔</div><div class="stat-val" style="font-size:1.4rem">' + fmtMoney(revenue) + '</div>' +
        '<div class="stat-sub">по всем заявкам (клик для среза по Заказчикам)</div></div>' +
    '</div>' +
    '<div class="card p"><div class="sec-title" style="display:flex; justify-content:space-between; align-items:center"><span>Топ регионов (кликните для отбора заявок)</span><button class="btn btn-sm btn-ghost" onclick="go(\'dash-customers\')">Группировка по Заказчикам ➔</button></div>' + (top || '<p class="t3">Нет данных</p>') + '</div>';
}

// ─── PAGE: SUPPLY ─────────────────────────────────────────────────────────────
function pageSupply() {
  var STAGE_KEYS  = ['request','survey','install','control','acceptance','payment'];
  var STAGE_NAMES = ['Заявка','Обследование','Монтаж','Контроль','Приёмка','Оплата'];

  if (!S.chains.length) return '<h1 class="page-title">Цепи по регионам</h1>' +
    '<div class="card p" style="text-align:center;padding:3rem"><p class="t3">Нет данных.</p><button class="btn" style="margin-top:1rem" onclick="go(\'data\')">Загрузить</button></div>';

  var curMgr = S.chainMgr || '';
  var mgrList = Array.from(new Set(S.tasks.map(function(t){ return t.manager || ''; }).filter(Boolean))).sort();
  var regList = S.chains.map(function(c){ return c.id; });

  // Фильтруем задачи текущего выбранного региона (с учетом ведущего менеджера)
  var selRegionId = S.selChain || (S.chains[0] ? S.chains[0].id : '');
  var regionTasks = S.tasks.filter(function(t){
    if (t.region !== selRegionId || t.archived) return false;
    if (curMgr && t.manager !== curMgr) return false;
    return true;
  });

  // Расчет метрик выбранного региона с учетом менеджера
  var totalRegTasks = regionTasks.length;
  var doneRegTasks  = regionTasks.filter(function(t){ return t.status === 'done'; }).length;
  var inProgTasks   = regionTasks.filter(function(t){ return t.status === 'progress' || t.status === 'pending'; }).length;
  var cancTasks     = regionTasks.filter(function(t){ return t.status === 'cancelled'; }).length;
  var totalRegAmt   = regionTasks.reduce(function(acc, t){ return acc + Number(t.amount || 0); }, 0);
  var cp = pct(doneRegTasks, totalRegTasks);

  // Считаем заявки по этапам для выбранного региона и менеджера
  var stageCount = {};
  STAGE_KEYS.forEach(function(k){ stageCount[k] = 0; });
  regionTasks.forEach(function(t){
    if (t.stage && stageCount[t.stage] !== undefined) stageCount[t.stage]++;
  });

  var stepsHtml = '';
  STAGE_NAMES.forEach(function(s, i) {
    var stageKey = STAGE_KEYS[i];
    var cnt = stageCount[stageKey] || 0;
    var isSel = S.selChainStep === stageKey;
    // Определяем статус этапа
    var isDone = false;
    if (i === 0 && doneRegTasks > 0) isDone = true;
    var stepStyle = isSel ? 'outline:2px solid var(--orange);outline-offset:2px;cursor:pointer;flex-shrink:0;' : 'cursor:pointer;flex-shrink:0;';
    stepsHtml += '<div class="step ' + (cnt > 0 ? 'active' : '') + '" style="' + stepStyle + '" data-step="' + stageKey + '">' +
      '<div class="step-icon">' + (cnt > 0 ? '⏳' : '○') + '</div>' +
      s +
      '<div style="font-size:.75rem;margin-top:2px;color:var(--orange-dark);font-weight:700">' + cnt + ' з.</div>' +
    '</div>';
    if (i < STAGE_NAMES.length - 1) stepsHtml += '<span class="chain-arr">→</span>';
  });

  var listHtml = '';
  S.chains.forEach(function(c) {
    var cTasks = S.tasks.filter(function(t){
      if (t.region !== c.id || t.archived) return false;
      if (curMgr && t.manager !== curMgr) return false;
      return true;
    });
    var cTotal = cTasks.length;
    var cDone  = cTasks.filter(function(t){ return t.status === 'done'; }).length;
    var cProg  = cTasks.filter(function(t){ return t.status === 'progress' || t.status === 'pending'; }).length;
    var cCanc  = cTasks.filter(function(t){ return t.status === 'cancelled'; }).length;
    var cAmt   = cTasks.reduce(function(acc, t){ return acc + Number(t.amount || 0); }, 0);
    var rp = pct(cDone, cTotal);
    var isSel = c.id === selRegionId;

    listHtml += '<div class="rrow' + (isSel?' sel':'') + '" data-cid="' + encodeURIComponent(c.id) + '">' +
      '<span class="rname">' + escHtml(c.id) + '</span>' +
      '<div class="rstats">' +
        '<span style="color:var(--green)">✓ ' + cDone + '</span>' +
        '<span style="color:var(--orange)">⏳ ' + cProg + '</span>' +
        '<span class="t3">✗ ' + cCanc + '</span>' +
      '</div>' +
      '<div class="rprog">' + bar(cDone, cTotal) + '</div>' +
      '<span class="ramt">' + rp + '% · ' + fmtMoney(cAmt) + '</span>' +
    '</div>';
  });

  return '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.75rem; flex-wrap:wrap; gap:.5rem">' +
      '<h1 class="page-title" style="margin:0">Цепи по регионам</h1>' +
      '<div style="display:flex; gap:.5rem; align-items:center">' +
        '<label style="font-size:.8rem; font-weight:600; color:var(--text-2)">Ведущий менеджер:</label>' +
        '<select id="chain_mgr_filter" style="min-width:180px">' +
          '<option value="">Все менеджеры</option>' +
          mgrList.map(function(m){ return '<option value="' + escHtml(m) + '"' + (curMgr === m ? ' selected' : '') + '>' + escHtml(m) + '</option>'; }).join('') +
        '</select>' +
        (curMgr ? '<button class="btn btn-sm btn-ghost" onclick="S.chainMgr=\'\';renderApp()">✕</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="g2">' +
      '<div>' +
        '<div class="card p mb">' +
          '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.75rem">' +
            '<div class="fw7" style="font-size:1.1rem">' + escHtml(selRegionId) + ' (' + totalRegTasks + ' заявок)</div>' +
            '<button class="btn btn-sm btn-ghost" onclick="filterAndGoTasks({reg:\'' + escHtml(selRegionId) + '\', mgr:\'' + escHtml(curMgr) + '\'})" title="Перейти ко всем заявкам этого региона">Открыть в Заявках ➔</button>' +
          '</div>' +
          '<div class="row" style="flex-wrap:wrap;gap:.75rem;margin-bottom:.9rem;font-size:.82rem">' +
            '<span style="color:var(--green)">✓ Готово: <strong>' + doneRegTasks + '</strong></span>' +
            '<span style="color:var(--orange)">⏳ В работе: <strong>' + inProgTasks + '</strong></span>' +
            '<span class="t3">✗ Отменено: <strong>' + cancTasks + '</strong></span>' +
            '<span style="color:var(--blue)">💰 ' + fmtMoney(totalRegAmt) + '</span>' +
          '</div>' +
          '<div class="chain-steps" style="overflow-x:auto; padding-bottom:.5rem; flex-wrap:nowrap">' + stepsHtml + '</div>' +
          '<div style="margin-top:.75rem">' + bar(doneRegTasks, totalRegTasks) + '</div>' +
          '<div style="text-align:right;font-size:.75rem;color:var(--text-3);margin-top:3px">' + cp + '% выполнено</div>' +
        '</div>' +
        (S.selChainStep ? (function(){
          var stepIdx = STAGE_KEYS.indexOf(S.selChainStep);
          var stepName = STAGE_NAMES[stepIdx] || S.selChainStep;
          var stepTasks = regionTasks.filter(function(t){ return t.stage === S.selChainStep; });
          if (!stepTasks.length) return '<div class="card p mb"><div class="sec-title">' + stepName + ' — нет заявок</div></div>';
          var rows = stepTasks.slice(0,30).map(function(t){
            var tid = (t.id||'').replace(/'/g,"\\'");
            return '<div style="display:flex;align-items:center;gap:.75rem;padding:.4rem 0;border-bottom:1px solid var(--border)">' +
              '<button class="btn-link" style="min-width:100px" onclick="openCard(\'' + tid + '\')">' + (t.id||'') + '</button>' +
              '<span class="t3" style="flex:1;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (t.address||'') + '</span>' +
              stBadge(t.status) +
              '<span class="t3" style="font-size:.75rem;white-space:nowrap">' + fmtMoney(t.amount) + '</span>' +
            '</div>';
          }).join('');
          var more = stepTasks.length > 30 ? '<div class="t3" style="font-size:.78rem;margin-top:.5rem">... ещё ' + (stepTasks.length-30) + ' заявок</div>' : '';
          return '<div class="card p mb"><div class="sec-title" style="margin-bottom:.5rem">' + stepName + ' (' + stepTasks.length + ' заявок) ' +
            '<button class="btn btn-sm btn-ghost" style="float:right;font-size:.7rem;padding:2px 8px" onclick="S.selChainStep=null;renderApp()">✕</button></div>' +
            rows + more + '</div>';
        })() : '') +
      '</div>' +
      '<div class="card p" style="max-height:70vh;overflow-y:auto">' +
        '<div class="sec-title">Все регионы (' + S.chains.length + ')</div>' +
        listHtml +
      '</div>' +
    '</div>';
}

// ─── PAGE: KANBAN ─────────────────────────────────────────────────────────────
function clearKanbanFilters() {
  S.kanbanQ = '';
  S.kanbanReg = '';
  S.kanbanMgr = '';
  S.kanbanCustomer = '';
  renderApp();
}

function pageKanban() {
  var q = (S.kanbanQ || '').toLowerCase().trim();
  var reg = S.kanbanReg || '';
  var mgr = S.kanbanMgr || '';
  var cust = S.kanbanCustomer || '';

  var regions = Array.from(new Set(S.tasks.map(function(t){ return t.region; }).filter(Boolean))).sort();
  var managers = Array.from(new Set(S.tasks.map(function(t){ return t.manager; }).filter(Boolean))).sort();
  var customers = Array.from(new Set(S.tasks.map(function(t){ return t.customer || 'ПАО Сбербанк'; }).filter(Boolean))).sort();

  function mkOpts(arr, cur) {
    return arr.map(function(v) {
      var safe = v.replace(/"/g, '&quot;');
      return '<option value="' + safe + '"' + (cur === v ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
  }

  var cols = [
    { id: 'request',    label: '1. Заявка',       cls: 'c-request',    desc: 'Распределение и назначение' },
    { id: 'survey',     label: '2. Обследование', cls: 'c-survey',     desc: 'Замеры и согласование' },
    { id: 'install',    label: '3. Монтаж',       cls: 'c-install',    desc: 'Прокладка и монтаж портов' },
    { id: 'control',    label: '4. Контроль',     cls: 'c-control',    desc: 'Прозвонка и чек-лист' },
    { id: 'acceptance', label: '5. Приёмка',      cls: 'c-acceptance', desc: 'Подписание ИД со Сбером' },
    { id: 'payment',    label: '6. Оплата',       cls: 'c-payment',    desc: 'Счета и выплаты' }
  ];

  var filtered = S.tasks.filter(function(t) {
    if (t.archived) return false;
    if (reg && t.region !== reg) return false;
    if (mgr && t.manager !== mgr) return false;
    if (cust && (t.customer || 'ПАО Сбербанк') !== cust) return false;
    if (q) {
      var content = ((t.id || '') + ' ' + (t.address || '') + ' ' + (t.contractor || '') + ' ' + (t.assignee || '') + ' ' + (t.customer || '')).toLowerCase();
      if (!content.includes(q)) return false;
    }
    return true;
  });

  var board = '';
  cols.forEach(function(col, colIdx) {
    var colTasks = filtered.filter(function(t){ 
      var stg = t.stage || 'request';
      return stg === col.id; 
    });
    var colAmt = colTasks.reduce(function(sum, t){ return sum + Number(t.amount || 0); }, 0);

    var cards = '';
    colTasks.slice(0, 60).forEach(function(t) {
      var tid = (t.id || '').replace(/'/g, "\\'");
      var fin = getTaskFinance(t);
      var prevK = colIdx > 0 ? cols[colIdx - 1].id : null;
      var nextK = colIdx < cols.length - 1 ? cols[colIdx + 1].id : null;

      var opts = cols.map(function(c){ 
        return '<option value="' + c.id + '"' + (c.id === (t.stage || 'request') ? ' selected' : '') + '>' + c.label + '</option>'; 
      }).join('');

      cards += '<div class="kcard" onclick="openCard(\'' + tid + '\')" style="cursor:pointer">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
          '<span style="font-weight:700;color:var(--orange);font-size:.82rem">№ ' + escHtml(t.id) + '</span>' +
          prBadge(t.priority) +
        '</div>' +
        '<div class="kcard-title" style="font-size:.78rem;margin-bottom:4px;line-height:1.25">' + escHtml(t.address || t.title || 'Без адреса') + '</div>' +
        '<div style="font-size:.72rem;color:var(--text-3);margin-bottom:4px;display:flex;justify-content:space-between">' +
          '<span>📍 ' + escHtml(t.region || '—') + '</span>' +
          (t.overdueDays > 0 ? '<span style="color:var(--red);font-weight:700">+' + t.overdueDays + ' дн</span>' : '') +
        '</div>' +
        '<div style="font-size:.72rem;color:var(--text-2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
          '👤 ' + escHtml(t.assignee || t.contractor || 'Не назначен') +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;font-size:.74rem;border-top:1px dashed var(--border);padding-top:4px;margin-top:4px">' +
          '<span style="font-weight:600">Порты: ' + (t.fact || 0) + ' / ' + (t.inOrder || 0) + '</span>' +
          '<span style="font-weight:700;color:var(--blue)">' + fmtMoney(fin.total) + '</span>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:3px;margin-top:6px" onclick="event.stopPropagation()">' +
          (prevK ? '<button class="btn btn-xs btn-ghost" onclick="moveTask(\'' + tid + '\', \'' + prevK + '\')" title="Назад" style="padding:2px 5px;font-size:.72rem">←</button>' : '') +
          '<select data-tid="' + t.id + '" class="kmove" style="flex:1;padding:2px 3px;font-size:.7rem;border-radius:4px;height:24px">' + opts + '</select>' +
          (nextK ? '<button class="btn btn-xs btn-ghost" onclick="moveTask(\'' + tid + '\', \'' + nextK + '\')" title="Вперед" style="padding:2px 5px;font-size:.72rem">→</button>' : '') +
        '</div>' +
      '</div>';
    });

    board += '<div class="kcol" style="min-width:240px;max-width:280px;flex:1">' +
      '<div class="kcol-hdr ' + col.cls + '" style="display:flex;justify-content:space-between;align-items:center">' +
        '<span>' + col.label + ' (' + colTasks.length + ')</span>' +
        '<span style="font-size:.68rem;opacity:.9;font-weight:600">' + fmtMoney(colAmt) + '</span>' +
      '</div>' +
      '<div style="font-size:.7rem;color:var(--text-3);margin:-.4rem 0 .5rem 2px">' + col.desc + '</div>' +
      cards +
      (colTasks.length === 0 ? '<div style="text-align:center;padding:1.5rem .5rem;color:var(--text-3);font-size:.75rem;border:1px dashed var(--border);border-radius:6px;background:#fafafa">Нет заявок</div>' : '') +
      (colTasks.length > 60 ? '<div style="text-align:center;padding:6px;color:var(--text-3);font-size:.72rem">... и ещё ' + (colTasks.length - 60) + '</div>' : '') +
    '</div>';
  });

  return '<h1 class="page-title">Канбан — Полный цикл обработки заявки</h1>' +
    '<div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem;align-items:center">' +
      '<input id="kq" type="text" placeholder="Поиск в канбане..." style="flex:2;min-width:170px" value="' + escHtml(S.kanbanQ || '') + '">' +
      '<select id="kreg"><option value="">Все регионы</option>' + mkOpts(regions, reg) + '</select>' +
      '<select id="kmgr"><option value="">Все менеджеры</option>' + mkOpts(managers, mgr) + '</select>' +
      '<select id="kcust"><option value="">Все заказчики</option>' + mkOpts(customers, cust) + '</select>' +
      (q || reg || mgr || cust ? '<button class="btn btn-sm btn-ghost" onclick="clearKanbanFilters()">✕ Сбросить</button>' : '') +
      '<input id="ntask" type="text" placeholder="Быстрая заявка…" style="flex:1;min-width:140px;max-width:220px">' +
      '<button class="btn btn-sm" id="addBtn">+ Добавить</button>' +
    '</div>' +
    '<div class="kanban" style="display:flex;gap:.8rem;overflow-x:auto;padding-bottom:1rem;align-items:flex-start">' + board + '</div>';
}

function clearFilters() {
  S.taskQ=''; S.taskSt=''; S.taskPr=''; S.taskReg=''; S.taskMgr=''; S.taskYear=''; S.taskOverdue='';
  S.taskCustomer='';
  S.taskArch='no'; S.taskStage=''; S.taskSort=''; // Сбрасываем новые фильтры
  renderApp();
}

function setTaskStageFilter(stg) {
  S.taskStage = stg;
  renderApp();
}

function statBox(lbl, val, sub, color) {
  return '<div style="text-align:center">' +
    '<div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3)">' + lbl + '</div>' +
    '<div style="font-size:1.05rem;font-weight:700;' + (color ? 'color:' + color + ';' : '') + '">' + val + '</div>' +
    (sub ? '<div style="font-size:.7rem;color:var(--text-3)">' + sub + '</div>' : '') +
  '</div>';
}

function pageTasks() {
  var q=S.taskQ, st=S.taskSt, pr=S.taskPr, reg=S.taskReg, mgr=S.taskMgr, yr=S.taskYear, ovd=S.taskOverdue, cust=S.taskCustomer;
  
  // 1. Фильтрация
  var filtered = S.tasks.filter(function(t) {
    // УМНЫЙ ПОИСК
    if (q) {
      var searchWords = q.toLowerCase().split(/\s+/).filter(Boolean);
      // Собираем всё содержимое строки в одну кучу для поиска
      var content = (
        (t.id || '') + ' ' + 
        (t.title || '') + ' ' + 
        (t.region || '') + ' ' + 
        (t.address || '') + ' ' + 
        (t.manager || '') + ' ' +
        (t.customer || '')
      ).toLowerCase();

      // Проверяем, что КАЖДОЕ слово из поиска есть в этой строке
      var isMatch = searchWords.every(function(word) {
        return content.indexOf(word) !== -1;
      });
      if (!isMatch) return false;
    }

    // Остальные фильтры (статус, приоритет и т.д. — оставляем как было)
    if (st  && t.status   !== st)  return false;
    if (pr  && t.priority !== pr)  return false;
    if (reg && t.region   !== reg) return false;
    if (mgr && t.manager  !== mgr) return false;
    if (yr  && t.sheet    !== yr)  return false;
    if (cust && (t.customer || 'ПАО Сбербанк') !== cust) return false;
    if (ovd==='yes' && !(t.overdueDays>0)) return false;
    if (ovd==='no'  && t.overdueDays>0)    return false;
    if (S.taskArch === 'no' && t.archived) return false;
    if (S.taskStage && t.stage !== S.taskStage) return false;
    if (S.user.role === 'worker' && t.assignmentStatus === 'pending') return false;

    return true;
  });

  // 2. Расчеты (добавляем Number() для защиты от склеивания строк)
  var sumAll     = filtered.reduce(function(s,t){ return s + Number(t.amount || 0); }, 0);
  var sumDone    = filtered.filter(function(t){return t.status==='done';}).reduce(function(s,t){ return s + Number(t.amount || 0); }, 0);
  var sumAct     = filtered.filter(function(t){return t.status==='progress';}).reduce(function(s,t){ return s + Number(t.amount || 0); }, 0);
  
  var cntOvd     = filtered.filter(function(t){return t.overdueDays > 0;}).length;
  
  var portsDone  = filtered.filter(function(t){return t.status==='done';}).reduce(function(s,t){return s + Number(t.fact || 0);}, 0);
  var portsTotal = filtered.reduce(function(s,t){return s + Number(t.inOrder || 0);}, 0);
  
  // Остаток портов (тоже через Number)
  var portBalance = filtered.reduce(function(acc, t) {
    var order = Number(t.inOrder || 0);
    var fact = Number(t.fact || 0);
    return acc + (order - fact);
  }, 0);

  var regions   = Array.from(new Set(S.tasks.map(function(t){return t.region||'';}).filter(Boolean))).sort();
  var managers  = Array.from(new Set(S.tasks.map(function(t){return t.manager||'';}).filter(Boolean))).sort();
  var customers = Array.from(new Set(S.tasks.map(function(t){return t.customer||'ПАО Сбербанк';}).filter(Boolean))).sort();
  var years     = Array.from(new Set(S.tasks.map(function(t){return t.sheet||'';}).filter(Boolean))).sort();

  // Сортировка — dateZayavki хранится в YYYY-MM-DD, localeCompare даёт правильный порядок
  if (S.taskSort) {
    filtered = filtered.slice().sort(function(a, b) {
      var da = a.dateZayavki || '';
      var db = b.dateZayavki || '';
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return S.taskSort === 'date_asc' ? da.localeCompare(db) : db.localeCompare(da);
    });
  }
  
  function mkOpts(arr,cur){return arr.map(function(v){
    var safe=v.replace(/"/g,'&quot;');
    return '<option value="'+safe+'"'+(cur===v?' selected':'')+'>'+v+'</option>';
  }).join('');}

  var hasFilter = q||st||pr||reg||mgr||yr||ovd||cust||S.taskArch==='yes'||S.taskStage;

  // Сетка totals изменена на 7 колонок (repeat(7,1fr))
  var totals = '<div class="card p mb" style="display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem;padding:.75rem 1rem">' +
    statBox('Заявок', fmtN(filtered.length), 'из '+fmtN(S.tasks.length), 'var(--orange)') +
    statBox('Сумма', fmtMoney(sumAll), null, null) +
    statBox('Выполнено', fmtMoney(sumDone), null, 'var(--green)') +
    statBox('В работе', fmtMoney(sumAct), null, 'var(--orange)') +
    statBox('Просрочено', fmtN(cntOvd), null, cntOvd>0?'var(--red)':'var(--green)') +
    statBox('Портов', fmtN(portsDone)+'/'+fmtN(portsTotal), null, null) +
    statBox('Остаток портов', fmtN(portBalance), 'заказ - факт', portBalance > 0 ? 'var(--orange)' : 'var(--green)') +
  '</div>';

  // Подсчет заявок по каждому этапу для быстрых табов
  var countsByStage = { all: S.tasks.filter(function(t){ return !t.archived; }).length };
  STAGE_KEYS.forEach(function(k){ countsByStage[k] = 0; });
  S.tasks.forEach(function(t){
    if (!t.archived && t.stage && countsByStage[t.stage] !== undefined) {
      countsByStage[t.stage]++;
    }
  });

  var stageTabsHtml = '<div style="display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.65rem">';
  var allActive = !S.taskStage;
  stageTabsHtml += '<button class="btn btn-sm ' + (allActive ? '' : 'btn-ghost') + '" onclick="setTaskStageFilter(\'\')" style="white-space:nowrap;font-size:.76rem;padding:3px 9px">' +
    'Все этапы <span style="opacity:.7;margin-left:3px">(' + countsByStage.all + ')</span>' +
  '</button>';

  STAGE_KEYS.forEach(function(k, idx) {
    var isActive = S.taskStage === k;
    var cnt = countsByStage[k] || 0;
    stageTabsHtml += '<button class="btn btn-sm ' + (isActive ? '' : 'btn-ghost') + '" onclick="setTaskStageFilter(\'' + k + '\')" style="white-space:nowrap;font-size:.76rem;padding:3px 9px">' +
      STAGE_ICONS[idx] + ' ' + (idx + 1) + '. ' + STAGE_NAMES[idx] + ' <span style="opacity:.7;margin-left:3px">(' + cnt + ')</span>' +
    '</button>';
  });
  stageTabsHtml += '</div>';

  var tableRows = '';
  filtered.slice(0, 300).forEach(function(t) {
    var od = t.overdueDays > 0
      ? '<span style="color:var(--red);font-weight:600">+' + t.overdueDays + ' дн</span>'
      : '<span class="t3">—</span>';
    
    var tid = (t.id || '').replace(/'/g, "\\'");
    var fin = getTaskFinance(t);

    tableRows += '<tr>' +
      // Номер с подсветкой
      '<td><button class="btn-link" onclick="openCard(\'' + tid + '\')">⇒ ' + highlight(t.id, q) + '</button></td>' +
      
      // Дата (тут подсвечивать нечего, формат меняется)
      '<td style="white-space:nowrap;color:var(--text-2);font-size:.8rem">' + (t.dateZayavki ? t.dateZayavki.slice(0, 10).split('-').reverse().join('.') : '<span class="t3">—</span>') + '</td>' +
      
      // Регион
      '<td>' + highlight(t.region || '', q) + '</td>' +
      
      '<td style="white-space:nowrap; font-weight:600">' + (t.fact || 0) + ' / ' + (t.inOrder || 0) + '</td>' +

      // Контрагент — кликабельная ячейка, открывает попап выбора/добавления
      '<td><button class="btn-link" onclick="openContractorPicker(\'' + tid + '\')">' +
        (t.contractor ? escHtml(t.contractor) : '<span class="t3">+ Добавить</span>') +
      '</button></td>' +

      // Статусы и кнопки (тут подсветка не нужна, это бейджи)
      '<td>' + prBadge(t.priority) + '</td>' +
      '<td>' + od + '</td>' +
      '<td>' + stageBadge(t.stage) + '</td>' +
      '<td>' + stBadge(t.status) + '</td>' +

      '<td style="white-space:nowrap; font-weight:700; color:var(--blue)">' + fmtMoney(fin.total) + '</td>' +
      '<td style="white-space:nowrap; color:var(--text-3)">' + fmtMoney(t.amount) + '</td>' +
      '<td><button class="btn btn-sm btn-ghost btn-icon" onclick="exportTask(\'' + tid + '\')">&#x2B07;</button></td>' +
    '</tr>';
  });

  var more = filtered.length>300
    ? '<tr><td colspan="12" style="text-align:center;padding:1rem;color:var(--text-3)">… ещё '+(filtered.length-300)+' заявок — уточните фильтр</td></tr>'
    : '';

  return '<h1 class="page-title">Заявки</h1>' +
    '<div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem;align-items:center">' +
      '<input id="tq" type="text" placeholder="Поиск по номеру, адресу..." style="flex:2;min-width:200px" value="'+q+'">' +
      '<select id="tst"><option value="">Все статусы</option>' +
        '<option value="pending"'  + (st==='pending'?' selected':'')  + '>Не распределено</option>' +
        '<option value="progress"' + (st==='progress'?' selected':'') + '>В работе</option>' +
        '<option value="done"'     + (st==='done'?' selected':'')     + '>Готово</option>' +
        '<option value="paid"'     + (st==='paid'?' selected':'')     + '>Оплачен</option>' +
        '<option value="cancelled"'+ (st==='cancelled'?' selected':'')+ '>Отменен</option>' +
      '</select>' +
      '<select id="tpr"><option value="">Все приоритеты</option>' +
        '<option value="high"'+(pr==='high'?' selected':'')+'>🔴 Высокий</option>' +
        '<option value="medium"'+(pr==='medium'?' selected':'')+'>🟡 Средний</option>' +
        '<option value="low"'+(pr==='low'?' selected':'')+'>🟢 Низкий</option>' +
      '</select>' +
      '<select id="tcust"><option value="">Все заказчики</option>'+mkOpts(customers,cust)+'</select>' +
      '<select id="treg"><option value="">Все регионы</option>'+mkOpts(regions,reg)+'</select>' +
      '<select id="tmgr"><option value="">Все менеджеры</option>'+mkOpts(managers,mgr)+'</select>' +
      '<select id="tyr"><option value="">Все годы</option>'+mkOpts(years,yr)+'</select>' +
      '<select id="tovd"><option value="">Любые</option>' +
        '<option value="yes"'+(ovd==='yes'?' selected':'')+'>⛔ Просроченные</option>' +
        '<option value="no"'+(ovd==='no'?' selected':'')+'>✓ Без просрочки</option>' +
      '</select>' +
      // ВОТ ОН, СЕЛЕКТОР АРХИВА:
      '<select id="tarch">' +
        '<option value="no"' + (S.taskArch==='no'?' selected':'') + '>Активные</option>' +
        '<option value="yes"' + (S.taskArch==='yes'?' selected':'') + '>Архив</option>' +
        '<option value=""' + (S.taskArch===''?' selected':'') + '>Все (с архивом)</option>' +
      '</select>' +
      '<select id="tstage">' +
        '<option value="">Все этапы</option>' +
        '<option value="request"' + (S.taskStage==='request'?' selected':'') + '>Заявка</option>' +
        '<option value="survey"' + (S.taskStage==='survey'?' selected':'') + '>Обследование</option>' +
        '<option value="install"' + (S.taskStage==='install'?' selected':'') + '>Монтаж</option>' +
        '<option value="control"' + (S.taskStage==='control'?' selected':'') + '>Контроль</option>' +
        '<option value="acceptance"' + (S.taskStage==='acceptance'?' selected':'') + '>Приёмка</option>' +
        '<option value="payment"' + (S.taskStage==='payment'?' selected':'') + '>Оплата</option>' +
      '</select>' +
      (hasFilter||S.taskSort ? '<button class="btn btn-sm btn-ghost" onclick="clearFilters()">✕ Сбросить</button>' : '') +
      '<select id="tsort">' +
        '<option value=""'+(S.taskSort===''?' selected':'')+'>Порядок по умолчанию</option>' +
        '<option value="date_desc"'+(S.taskSort==='date_desc'?' selected':'')+'>📅 Новые сначала</option>' +
        '<option value="date_asc"'+(S.taskSort==='date_asc'?' selected':'')+'>📅 Старые сначала</option>' +
      '</select>' +
    '</div>' +
    stageTabsHtml +
    totals +
    '<div class="card tbl-wrap">' +
      '<table><thead><tr>' +
        '<th>Номер</th><th>Дата</th><th>Регион</th><th>Порты</th><th>Контрагент</th>' +
        '<th>Приоритет</th><th>Просрочка</th><th>Этап</th><th>Статус</th>' +
        '<th title="Итого: ПО + ТМЦ">Платит Сбер</th><th title="Сумма из Excel">Сумма (спр.)</th><th></th>' +
      '</tr></thead><tbody>'+tableRows+more+'</tbody></table>' +
    '</div>' +
    renderContractorPicker();
}

function renderContractorPicker() {
  if (!S.cpTaskId) return '';
  var t = S.tasks.find(function(x){ return String(x.id) === String(S.cpTaskId); });
  if (!t) return '';

  var body = '';
  if (S.cpMode === 'new') {
    body =
      '<div class="g2 mb">' +
        '<input id="pc_inn" type="text" placeholder="ИНН" oninput="onContractorSearchInput(this.value,\'pc\')">' +
        '<input id="pc_kpp" type="text" placeholder="КПП (если есть)">' +
      '</div>' +
      '<div style="position:relative">' +
        '<div id="pc_suggestions_box" style="display:none; position:absolute; top:0; left:0; right:0; background:#fff; border:1.5px solid var(--orange); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.15); z-index:700; max-height:250px; overflow-y:auto"></div>' +
      '</div>' +
      '<div class="mb"><input id="pc_name_short" type="text" placeholder="Краткое название (ИП / ООО)" oninput="onContractorSearchInput(this.value,\'pc\')"></div>' +
      '<div class="mb"><textarea id="pc_name_full" placeholder="Полное наименование" style="width:100%; resize:vertical; min-height:50px"></textarea></div>' +
      '<div class="mb"><input id="pc_director" type="text" placeholder="ФИО Руководителя"></div>' +
      '<div class="mb"><textarea id="pc_address" placeholder="Юридический адрес" style="width:100%; resize:vertical; min-height:50px"></textarea></div>' +
      '<div class="mb"><input id="pc_bank" type="text" placeholder="Название Банка" style="width:100%"></div>' +
      '<div class="row mb">' +
        '<input id="pc_bik" type="text" placeholder="БИК" style="flex:1">' +
        '<button class="btn btn-sm btn-ghost" onclick="fillBankFromDaData(\'pc\')">🔍 Найти по БИК</button>' +
      '</div>' +
      '<div class="mb"><input id="pc_acc_corr" type="text" placeholder="Корр. счет" style="width:100%"></div>' +
      '<div class="mb"><input id="pc_acc_pay" type="text" placeholder="Расчетный счет" style="width:100%"></div>' +
      '<div class="g2 mb">' +
        '<input id="pc_phone" type="text" placeholder="Телефон">' +
        '<input id="pc_email" type="text" placeholder="Email">' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:1rem">' +
        '<button class="btn btn-sm btn-ghost" onclick="S.cpMode=\'search\';renderApp()">← Назад к поиску</button>' +
        '<span><span id="pc_status" style="margin-right:1rem;color:var(--text-3);font-size:.8rem"></span>' +
        '<button class="btn" onclick="addContractorFromPicker(\'' + S.cpTaskId.replace(/'/g,"\\'") + '\')">+ Сохранить и назначить</button></span>' +
      '</div>';
  } else {
    var qy = (S.cpQuery || '').toLowerCase();
    var matches = (S.contractors || []).filter(function(c) {
      if (!qy) return true;
      return (c.name_short||'').toLowerCase().indexOf(qy) !== -1 ||
             (c.name_full||'').toLowerCase().indexOf(qy) !== -1 ||
             (c.inn||'').toLowerCase().indexOf(qy) !== -1;
    }).slice(0, 30);

    var list = matches.length
      ? matches.map(function(c) {
          return '<div class="field-row" style="cursor:pointer" onclick="assignContractorToTask(\'' + S.cpTaskId.replace(/'/g,"\\'") + '\',\'' + (c.name_short||'').replace(/'/g,"\\'") + '\')">' +
            '<div class="field-lbl">' + escHtml(c.name_short) + '</div>' +
            '<div class="field-val t3">ИНН ' + (c.inn||'—') + '</div>' +
          '</div>';
        }).join('')
      : '<div class="t3" style="padding:.5rem 0">Ничего не найдено</div>';

    body =
      '<input type="text" placeholder="Поиск по названию или ИНН..." value="' + (S.cpQuery||'').replace(/"/g,'&quot;') + '" ' +
        'oninput="S.cpQuery=this.value;renderApp()" style="width:100%;margin-bottom:.75rem" autofocus>' +
      '<div style="max-height:300px;overflow-y:auto">' + list + '</div>' +
      '<div style="text-align:right;margin-top:1rem">' +
        '<button class="btn btn-sm" onclick="S.cpMode=\'new\';renderApp()">+ Добавить нового</button>' +
      '</div>';
  }

  return '<div class="modal-overlay" onclick="if(event.target===this) closeContractorPicker()">' +
    '<div class="modal-box">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">' +
        '<h3>Контрагент — заявка ' + escHtml(t.id) + '</h3>' +
        '<button class="btn btn-sm btn-ghost" onclick="closeContractorPicker()">✕</button>' +
      '</div>' +
      body +
    '</div>' +
  '</div>';
}

function openContractorPicker(taskId) {
  S.cpTaskId = taskId;
  S.cpMode = 'search';
  S.cpQuery = '';
  renderApp();
}

function closeContractorPicker() {
  S.cpTaskId = null;
  renderApp();
}

function assignContractorToTask(taskId, nameShort) {
  var t = S.tasks.find(function(x){ return String(x.id) === String(taskId); });
  if (!t) return;
  var now = new Date().toLocaleString('ru');
  var author = S.user ? (S.user.full_name || S.user.username) : 'Система';
  var hist = t._history || [];
  if ((t.contractor||'') !== nameShort) {
    hist.push({date:now, author:author, field:'Подрядчик', old:t.contractor||'', new:nameShort});
  }
  api('/tasks/' + taskId, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({contractor: nameShort, _history: hist})})
    .then(function(){
      t.contractor = nameShort;
      t._history = hist;
      closeContractorPicker();
    })
    .catch(function(e){ alert('Ошибка: ' + e.message); });
}
function acceptTask(taskId) {
  api('/tasks/' + taskId + '/accept', { method: 'POST' }).then(function(res) {
    if (res.error) return alert(res.error);
    var t = S.tasks.find(function(x){ return String(x.id) === String(taskId); });
    if (t) t.assignmentStatus = 'accepted';
    renderApp();
  });
}

function declineTask(taskId) {
  if (!confirm('Отказаться от заявки? Она станет неназначенной.')) return;
  api('/tasks/' + taskId + '/decline', { method: 'POST' }).then(function(res) {
    if (res.error) return alert(res.error);
    var t = S.tasks.find(function(x){ return String(x.id) === String(taskId); });
    if (t) { t.assignmentStatus = 'declined'; t.assignee = ''; t.contractor = ''; }
    S.page = 'tasks';
    renderNav();
    renderApp();
  });

// ─── Парсинг Excel на стороне браузера ───────────────────────────────────────
function parseDate(v) {
    if (!v) return null;
    // 1. Объект даты
    if (v instanceof Date) {
      if (isNaN(v.getTime())) return null;
      var y = v.getFullYear(), mo = v.getMonth() + 1, d = v.getDate();
      return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }
    // 2. Число Excel
    if (typeof v === 'number') {
      var parsed = XLSX.SSF.parse_date_code(v);
      if (parsed) return parsed.y + '-' + String(parsed.m).padStart(2, '0') + '-' + String(parsed.d).padStart(2, '0');
      return null;
    }
    // 3. Строка
    var s = String(v).trim();
    if (!s || s.length < 6) return null;
    // Попытка прочитать длинную строку "Thu Apr 02..."
    var tryNative = new Date(s);
    if (!isNaN(tryNative.getTime())) {
      var ny = tryNative.getFullYear(), nm = tryNative.getMonth() + 1, nd = tryNative.getDate();
      if (ny >= 1900 && ny <= 2100) return ny + '-' + String(nm).padStart(2, '0') + '-' + String(nd).padStart(2, '0');
    }
    // Попытка прочитать формат 02.04.2026
    var mRu = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);
    if (mRu) {
      var dd = parseInt(mRu[1]), mm = parseInt(mRu[2]), yy = parseInt(mRu[3]);
      if (yy < 100) yy += 2000;
      return yy + '-' + String(mm).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
    }
    return null;
  }

  function parseNum(v) {
    if (v === null || v === undefined || v === '') return 0;
    if (typeof v === 'number') return v;
    // Удаляем любые буквы, пробелы (в т.ч. неразрывные) и символы валют
    var s = String(v).replace(/[^0-9.,-]/g, '').replace(',', '.');
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function clientParseSvodnye(workbook) {
    var sheetNames = workbook.SheetNames.filter(function(n) { return n.startsWith('Заявки'); });
    var allRows = [];
    function normKey(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
    function strVal(v) { if (v === null || v === undefined) return ''; return String(v).replace(/\n/g, ' ').trim(); }



    function findCol(row, keyMap, variants) {
      for (var i = 0; i < variants.length; i++) {
        var nv = normKey(variants[i]);
        if (keyMap[nv] !== undefined) {
          var v = row[keyMap[nv]];
          if (v !== null && v !== undefined && String(v).trim() !== '') return v;
        }
      }
      return null;
    }


    function buildKeyMap(row) {
      var map = {};
      Object.keys(row).forEach(function(k) { map[normKey(k)] = k; });
      return map;
    }


    for (var si = 0; si < sheetNames.length; si++) {
      var shName = sheetNames[si];
      var ws = workbook.Sheets[shName];
      var rows = XLSX.utils.sheet_to_json(ws, { defval: null, raw: true });
      if (!rows.length) continue;

      // --- ШАГ 1: ОПРЕДЕЛЯЕМ КОЛОНКИ (ОДИН РАЗ НА ЛИСТ) ---
      var firstRow = rows[0];
      var range = XLSX.utils.decode_range(ws['!ref']);
      var keys = [];
      for(var C = range.s.c; C <= range.e.c; ++C) {
        var cell = ws[XLSX.utils.encode_cell({r:range.s.r, c:C})];
        if(cell) keys.push(String(cell.v));
      }
      
      // Создаем карту соответствия: наше имя -> реальное имя в Excel
      var colMap = {};
      var usedCols = new Set();
      var targets = ['Номер', 'Статус', 'Регион', 'Адрес', 'ТИП РАБОТ', 'Тип объекта', '№ ГОСБ', '№ ВСП', 
                     'Дата заявки', 'Дата окончания работ', 'Текущая дата', 'Менеджер Сбера', 
                     'Контакт', 'Подрядчик', 'В заказе', 'Факт', 'Обследование', 'Доступ', 
                     'Дата выхода', 'Приёмка', 'Оплата подрядчику', 'ИД', 'Сумма договора', 
                     'Стоимость за ед.', 'Ссылка на Тех.Информацию', '№ документа в ЭДО', 
                     '№ счета/сумма', 'В ЭДО', 'Комментарий', 'дней просрочки', 'Удаленность', 'ТМЦ', 'Допы'];

      
      // --- ШАГ 1: УЛУЧШЕННЫЙ ПОИСК КОЛОНОК ---
      var usedCols = new Set(); // Хранилище занятых колонок
      targets.forEach(function(target) {
        var normTarget = target.toLowerCase().replace(/[^а-яёa-z0-9]/g, '');
        
        // 1. Ищем идеальное совпадение
        var exactMatch = keys.find(function(k) {
          return k.toLowerCase().replace(/[^а-яёa-z0-9]/g, '') === normTarget && !usedCols.has(k);
        });
        
        if (exactMatch) {
          colMap[target] = exactMatch;
          usedCols.add(exactMatch);
          return;
        }

        // 2. Ищем мягкое совпадение
        var bestMatch = null;
        var minDistance = 2;

        for (var i = 0; i < keys.length; i++) {
          var key = String(keys[i]);
          if (usedCols.has(key)) continue; // Пропускаем уже занятые колонки!

          var normKey = key.toLowerCase().replace(/[^а-яёa-z0-9]/g, '');
          
          // Проверяем прямое вхождение (если слова длинные)
          if ((normKey.includes(normTarget) || normTarget.includes(normKey)) && normTarget.length > 2) {
            bestMatch = key;
            break;
          }

          var dist = levenshtein(normKey, normTarget);
          if (dist < minDistance) {
            minDistance = dist;
            bestMatch = key;
          }
        }
        
        if (bestMatch) {
          colMap[target] = bestMatch;
          usedCols.add(bestMatch);
        }
      });
      // --- ШАГ 2: БЫСТРЫЙ ПАРСИНГ СТРОК ---
      for (var ri = 0; ri < rows.length; ri++) {
        var row = rows[ri];
        
        // Берем данные по заранее найденным ключам
        var num = strVal(row[colMap['Номер']]).trim();
        if (!num) continue;

        var rawStatus = strVal(row[colMap['Статус']]).toLowerCase();
        var status = 'progress';
        if (rawStatus.includes('оплачен')) status = 'paid';
        else if (rawStatus.includes('готов')) status = 'done';
        else if (rawStatus.includes('отмен') || rawStatus.includes('стоп')) status = 'cancelled';

        var overdue = parseNum(row[colMap['дней просрочки']]);
        var addr = strVal(row[colMap['Адрес']]);

        var rawOplata = strVal(row[colMap['Оплата подрядчику']]).toLowerCase();
        var rawPriemka = strVal(row[colMap['Приёмка']]).toLowerCase();
        var rawIdStatus = strVal(row[colMap['ИД']]).toLowerCase();
        var rawObsledovanie = strVal(row[colMap['Обследование']]).toLowerCase();
        var inOrder = parseNum(row[colMap['В заказе']]);
        var fact = parseNum(row[colMap['Факт']]);
        var dataVyhoda = parseDate(row[colMap['Дата выхода']]);

        var stage = 'request';
        if (status === 'paid' || rawOplata.includes('оплач') || rawOplata.includes('да') || rawOplata.includes('+') || rawIdStatus.includes('оплач')) {
          stage = 'payment';
        } else if (status === 'done' || rawPriemka.includes('принят') || rawPriemka.includes('да') || rawPriemka.includes('+') || rawIdStatus.includes('принят')) {
          stage = 'acceptance';
        } else if (fact > 0 && inOrder > 0 && fact >= inOrder) {
          stage = 'control';
        } else if (dataVyhoda || fact > 0 || status === 'progress') {
          stage = 'install';
        } else if (rawObsledovanie && rawObsledovanie !== '-' && rawObsledovanie !== 'нет') {
          stage = 'survey';
        }

        if (stage === 'request' && status !== 'cancelled') {
          status = 'pending';
        }

        allRows.push({
          id: num, 
          sheet: shName,
          title: num + (addr ? ' — ' + addr.slice(0, 80) : ''),
          // Используем colMap, который мы подготовили в Шаге 1
          region: strVal(row[colMap['Регион']]).split(/[\s,\n]/)[0].trim(),
          address: addr,
          workType:     strVal(row[colMap['ТИП РАБОТ']]),
          tipObj:       strVal(row[colMap['Тип объекта']]),
          gosb:         strVal(row[colMap['№ ГОСБ']]),
          vsp:          strVal(row[colMap['№ ВСП']]),
          dateZayavki:  parseDate(row[colMap['Дата заявки']]),
          deadline:     parseDate(row[colMap['Дата окончания работ']]),
          currentDate:  parseDate(row[colMap['Текущая дата']]),
          manager:      strVal(row[colMap['Менеджер Сбера']]),
          contact:      strVal(row[colMap['Контакт']]),
          contractor:   strVal(row[colMap['Подрядчик']]),
          inOrder:      inOrder,
          fact:         fact,
          obsledovanie: strVal(row[colMap['Обследование']]),
          dostup:       strVal(row[colMap['Доступ']]),
          dataVyhoda:   dataVyhoda,
          priemka:      strVal(row[colMap['Приёмка']]),
          oplata:       strVal(row[colMap['Оплата подрядчику']]),
          idStatus:     strVal(row[colMap['ИД']]),
          amount:       parseNum(row[colMap['Сумма договора']]),
          
          distanceKm:   parseNum(row[colMap['Удаленность']]),
          pricePerUnit: parseNum(row[colMap['Стоимость за ед.']]),
          tmc:          parseNum(row[colMap['ТМЦ']]),
          extras:       parseNum(row[colMap['Допы']]),
          overdueDays:  overdue,

          techLink:     strVal(row[colMap['Ссылка на Тех.Информацию']]),
          edoNumber:    strVal(row[colMap['№ документа в ЭДО']]),
          invoiceInfo:  strVal(row[colMap['№ счета/сумма']]),
          vedoStatus:   strVal(row[colMap['В ЭДО']]),
          excelComment: strVal(row[colMap['Комментарий']]),
          status: status, 
          stage: stage,
          overdueDays: overdue,
          archived: false,
          rawData: (function() {
            var raw = {};
            Object.keys(row).forEach(function(k) {
              if (!k.trim().startsWith('__')) raw[k.trim()] = strVal(row[k]);
            });
            return raw;
          })()
        });
      }
    }
    return allRows;
  }


function doUpload(file) {
  if (!file.name.match(/\.(xlsx|xls)$/i)) { alert('Только .xlsx / .xls'); return; }
  
  var st = document.getElementById('ustatus');
  function setStatus(html) { if (st) st.innerHTML = html; }
  function showErr(msg) {
    setStatus('<div class="banner" style="background:#FEE2E2;border:1px solid #FECACA"><div><div class="banner-title" style="color:#B91C1C">❌ Ошибка</div><div class="banner-body">' + msg + '</div></div></div>');
  }

  setStatus('<div class="spin-wrap"><div class="spin"></div><p style="margin-top:.6rem">Читаем файл…</p></div>');
  
  var reader = new FileReader();
  reader.onload = function(e) {
    setTimeout(function() {
      try {
        setStatus('<div class="spin-wrap"><div class="spin"></div><p style="margin-top:.6rem">Парсинг таблицы…</p></div>');
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array', cellDates:true, cellFormula:false, cellText:false});
        var hasSheets = wb.SheetNames.some(function(n){ return n.startsWith('Заявки'); });
        
        if (!hasSheets) {
          setStatus('<div class="banner banner-warn"><div><div class="banner-title">⚠️ Файл не распознан</div><div class="banner-body">Нет листов «Заявки 20XX». Данные не изменены.</div></div></div>');
          return;
        }

        setTimeout(function() {
          try {
            var rows = clientParseSvodnye(wb);
            var total = rows.length;
            var sent = 0;
            var BATCH = 200; // Стабильный размер пачки для Railway
            
            var p = Math.round((sent / total) * 100);
            setStatus(
              '<div style="margin-top:1rem">' +
                '<div style="display:flex; justify-content:space-between; font-size:.8rem; font-weight:600; margin-bottom:6px">' +
                  '<span>Импорт в базу...</span><span>' + p + '% (' + sent + ' / ' + total + ')</span>' +
                '</div>' +
                '<div class="prog"><div class="prog-fill" style="width:' + p + '%"></div></div>' +
              '</div>'
            );

            function sendBatch(isFirst) {
              var batch = rows.slice(sent, sent + BATCH);
              if (!batch.length) {
                // Финальная загрузка статистики и данных после успеха
                return Promise.all([api('/stats'), api('/tasks'), api('/chains'), api('/import-info')])
                  .then(function(res){
                    S.stats=res[0]; S.tasks=res[1]; S.chains=res[2]; S.importInfo=res[3];
                    setStatus('<div class="banner banner-ok"><div><div class="banner-title">✅ Импорт успешен!</div><div class="banner-body">Загружено <strong>' + fmtN(total) + ' заявок</strong></div></div><div class="row" style="gap:.5rem"><button class="btn btn-sm" onclick="go(\'tasks\')">К заявкам</button></div></div>');
                    renderApp();
                  });
              }

              return fetch('/api/excel/import-rows', {
                method: 'POST', 
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + S.token // ДОБАВИЛИ ТОКЕН
                },
                body: JSON.stringify({rows: batch, name: file.name, isFirst: isFirst, totalRows: total, isLast: (sent + batch.length >= total)})
              })
              .then(function(r) {
                if (!r.ok) throw new Error('Ошибка сервера: ' + r.status); // ПРОВЕРКА ОШИБКИ (чтобы не было <)
                return r.json();
              })
              .then(function(result) {
                if (result.error) throw new Error(result.error);
                sent += batch.length;
                var p = Math.round((sent / total) * 100);
                setStatus(
                  '<div style="margin-top:1rem">' +
                    '<div style="display:flex; justify-content:space-between; font-size:.8rem; font-weight:600; margin-bottom:6px">' +
                      '<span>Импорт в базу...</span><span>' + p + '% (' + sent + ' / ' + total + ')</span>' +
                    '</div>' +
                    '<div class="prog"><div class="prog-fill" style="width:' + p + '%"></div></div>' +
                  '</div>'
                );
                return sendBatch(false);
              });
            }

            sendBatch(true).catch(function(e){ showErr(e.message); });
          } catch(e) { showErr('Ошибка парсинга: ' + e.message); }
        }, 50);
      } catch(e) { showErr('Ошибка чтения файла: ' + e.message); }
    }, 50);
  };
  reader.readAsArrayBuffer(file);
}

// Отправка PDF в нейросеть и автозаполнение формы
// Отправка PDF в нейросеть (Асинхронно)
function processPdfWithAi(inputEl) {
  var file = inputEl.files[0];
  if (!file) return;
  S.pendingPdfFile = file; // Запоминаем файл для прикрепления к заявке

  switchDocTab('pdf');
  updateDocTabBadges();

  var emptyMsg = document.getElementById('ai_pdf_empty_msg');
  if (emptyMsg) emptyMsg.style.display = 'none';

  // Загружаем PDF в превью прямо в браузере
  var previewWrap = document.getElementById('ai_pdf_preview_wrap');
  var previewFrame = document.getElementById('ai_pdf_preview_frame');
  if (previewWrap && previewFrame) {
    previewFrame.src = URL.createObjectURL(file);
    previewWrap.style.display = 'block';
  }
  var fd = new FormData();
  fd.append('file', file);
  
  var btn = inputEl.nextElementSibling;
  S.aiParserBtnText = btn.innerHTML; // Запоминаем текст кнопки
  S.aiParserBtn = btn;
  S.aiParserInput = inputEl;
  
  btn.innerHTML = '<span class="btn-spinner"></span> Анализ документа...';
  btn.disabled = true;

  var logBox = document.getElementById('ai_log_box');
  var logContent = document.getElementById('ai_log_content');
  if (logBox && logContent) {
    logContent.innerHTML = '';
    logBox.style.display = 'block';
    logBox.classList.add('terminal-pulse');
  }
  fetch('/api/ai/parse-pdf', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + S.token },
    body: fd
  })
  .then(function(r) { 
    if (!r.ok) return r.text().then(text => { throw new Error(text); });
    return r.json(); 
  })
  .catch(function(e) {
    // Сброс кнопки только если ошибка сети
    btn.innerHTML = S.aiParserBtnText;
    btn.disabled = false;
    inputEl.value = '';
    alert('Ошибка загрузки файла: ' + e.message);
  });
  // Важно: мы не ждем данных здесь. Мы просто загрузили файл.
}

// ─── TABS & PENDING FILES (Заказ / Схема / Чек-лист на форме создания) ──────
S.pendingSchemeFiles = [];
S.pendingChecklistFiles = [];

function switchDocTab(tabName) {
  ['pdf', 'scheme', 'checklist'].forEach(function(t) {
    var btn = document.getElementById('tab_btn_' + t);
    var content = document.getElementById('doc_tab_content_' + t);
    if (btn) {
      if (t === tabName) {
        btn.style.background = 'var(--orange-bg)';
        btn.style.borderColor = 'var(--orange)';
        btn.style.color = 'var(--orange-dark)';
      } else {
        btn.style.background = 'none';
        btn.style.borderColor = 'transparent';
        btn.style.color = 'inherit';
      }
    }
    if (content) {
      content.style.display = (t === tabName) ? 'block' : 'none';
    }
  });
  var body = document.getElementById('nt_docs_body');
  var toggleBtn = document.getElementById('btn_toggle_all_docs');
  if (body) body.style.display = 'block';
  if (toggleBtn) toggleBtn.textContent = 'Свернуть ▴';
}

function toggleAllDocs() {
  var body = document.getElementById('nt_docs_body');
  var btn = document.getElementById('btn_toggle_all_docs');
  if (!body || !btn) return;
  var isHidden = body.style.display === 'none';
  body.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? 'Свернуть ▴' : 'Развернуть ▾';
}

function updateDocTabBadges() {
  var bPdf = document.getElementById('tab_badge_pdf');
  var bScheme = document.getElementById('tab_badge_scheme');
  var bChecklist = document.getElementById('tab_badge_checklist');

  if (bPdf) {
    if (S.pendingPdfFile) {
      bPdf.textContent = '1';
      bPdf.style.display = 'inline-block';
    } else {
      bPdf.style.display = 'none';
    }
  }
  if (bScheme) {
    if (S.pendingSchemeFiles && S.pendingSchemeFiles.length) {
      bScheme.textContent = S.pendingSchemeFiles.length;
      bScheme.style.display = 'inline-block';
    } else {
      bScheme.style.display = 'none';
    }
  }
  if (bChecklist) {
    if (S.pendingChecklistFiles && S.pendingChecklistFiles.length) {
      bChecklist.textContent = S.pendingChecklistFiles.length;
      bChecklist.style.display = 'inline-block';
    } else {
      bChecklist.style.display = 'none';
    }
  }
}

function handlePendingFiles(type, inputEl) {
  var arr = type === 'scheme' ? S.pendingSchemeFiles : S.pendingChecklistFiles;
  for (var i = 0; i < inputEl.files.length; i++) {
    arr.push(inputEl.files[i]);
  }
  inputEl.value = ''; // Сброс input, чтобы можно было выбрать тот же файл повторно
  renderPendingChips(type);
  switchDocTab(type);
  updateDocTabBadges();
  var emptyMsg = document.getElementById('nt_' + type + '_empty_msg');
  if (emptyMsg) emptyMsg.style.display = 'none';
  // Автоматически показываем превью последнего добавленного файла
  if (arr.length > 0) {
    previewPendingFile(type, arr[arr.length - 1]);
  }
}

function removePendingFile(type, index) {
  var arr = type === 'scheme' ? S.pendingSchemeFiles : S.pendingChecklistFiles;
  arr.splice(index, 1);
  renderPendingChips(type);
  updateDocTabBadges();
  // Если файлов не осталось — скрываем превью и возвращаем заглушку
  if (arr.length === 0) {
    var wrap = document.getElementById('nt_' + type + '_preview_wrap');
    var chips = document.getElementById('nt_' + type + '_chips');
    var emptyMsg = document.getElementById('nt_' + type + '_empty_msg');
    if (wrap) wrap.style.display = 'none';
    if (chips) chips.style.display = 'none';
    if (emptyMsg) emptyMsg.style.display = 'block';
  } else {
    // Показываем превью последнего оставшегося файла
    previewPendingFile(type, arr[arr.length - 1]);
  }
}

function renderPendingChips(type) {
  var arr = type === 'scheme' ? S.pendingSchemeFiles : S.pendingChecklistFiles;
  var el = document.getElementById('nt_' + type + '_chips');
  if (!el) return;
  if (!arr.length) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  el.style.display = 'block';
  var icon = type === 'scheme' ? '🗺️' : '📋';
  el.innerHTML = '<div style="display:flex; gap:6px; flex-wrap:wrap;">' +
    arr.map(function(f, idx) {
      var sizeKb = (f.size / 1024).toFixed(0);
      return '<div style="display:inline-flex; align-items:center; gap:4px; background:var(--orange-bg); border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-size:.78rem;">' +
        '<span>' + icon + '</span>' +
        '<span style="max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escHtml(f.name) + '">' + escHtml(f.name) + '</span>' +
        '<span class="t3">(' + sizeKb + ' КБ)</span>' +
        '<button type="button" style="background:none; border:none; cursor:pointer; font-size:.85rem; padding:0 2px;" onclick="previewPendingFile(\'' + type + '\', S.pending' + (type === 'scheme' ? 'Scheme' : 'Checklist') + 'Files[' + idx + '])" title="Предпросмотр">👁️</button>' +
        '<button type="button" style="background:none; border:none; cursor:pointer; font-size:.85rem; padding:0 2px; color:var(--red);" onclick="removePendingFile(\'' + type + '\',' + idx + ')" title="Убрать">✖</button>' +
      '</div>';
    }).join('') +
  '</div>';
}

function previewPendingFile(type, file) {
  if (!file) return;
  var wrap = document.getElementById('nt_' + type + '_preview_wrap');
  var content = document.getElementById('nt_' + type + '_preview_content');
  var emptyMsg = document.getElementById('nt_' + type + '_empty_msg');
  if (!wrap || !content) return;
  if (emptyMsg) emptyMsg.style.display = 'none';

  var url = URL.createObjectURL(file);
  var isImage = file.type.startsWith('image/');
  var isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');

  if (isImage) {
    content.innerHTML = '<img src="' + url + '" style="max-width:100%; max-height:400px; object-fit:contain; border-radius:6px;" alt="' + escHtml(file.name) + '">';
  } else if (isPdf) {
    content.innerHTML = '<iframe src="' + url + '" style="width:100%; height:400px; border:none; border-radius:6px;"></iframe>';
  } else {
    // Для остальных форматов (xlsx, docx, dwg) — просто иконка с именем файла
    content.innerHTML = '<div style="padding:2rem; color:var(--text-2);">' +
      '<div style="font-size:2.5rem; margin-bottom:8px;">📄</div>' +
      '<div style="font-weight:600;">' + escHtml(file.name) + '</div>' +
      '<div class="t3" style="margin-top:4px;">Предпросмотр недоступен для этого формата</div>' +
    '</div>';
  }

  wrap.style.display = 'block';
  content.style.display = 'block';
}

    comment:      document.getElementById('nt_comment').value.trim(),
    vsp:          document.getElementById('nt_vsp').value.trim(),
    customer:     (document.getElementById('nt_customer') ? document.getElementById('nt_customer').value : 'ПАО Сбербанк'),
    manager:      document.getElementById('nt_manager').value.trim(),
    contact:      document.getElementById('nt_contact').value.trim()
  };

  if (!data.id) {
    return alert('Пожалуйста, укажите Номер заявки!');
  }

  // Меняем текст кнопки, чтобы показать процесс
  var btn = event.target;
  var originalBtnText = btn.innerHTML;
  btn.innerHTML = 'Создание...';
  btn.disabled = true;

  api('/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(function(res) {
    btn.innerHTML = originalBtnText;
    btn.disabled = false;

    if (res.error) {
      alert('Ошибка: ' + res.error);
      return;
    }
    
    // 1. Очищаем все поля формы
    var fieldsToClear = ['nt_id', 'nt_vsp', 'nt_region', 'nt_address', 'nt_manager', 'nt_contact', 'nt_workType', 'nt_amount', 'nt_pricePerUnit', 'nt_inOrder', 'nt_fact', 'nt_dateZayavki', 'nt_deadline', 'nt_techLink', 'nt_invoiceInfo', 'nt_comment'];
    fieldsToClear.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });

    // Очищаем и сворачиваем превью PDF, если оно было открыто
    var previewWrap = document.getElementById('ai_pdf_preview_wrap');
    var previewFrame = document.getElementById('ai_pdf_preview_frame');
    if (previewWrap && previewFrame) {
      previewFrame.src = '';
      previewWrap.style.display = 'none';
    }
    // Очищаем превью Схемы и Чек-листа
    ['scheme', 'checklist'].forEach(function(docType) {
      var w = document.getElementById('nt_' + docType + '_preview_wrap');
      var c = document.getElementById('nt_' + docType + '_preview_content');
      var ch = document.getElementById('nt_' + docType + '_chips');
      if (w) w.style.display = 'none';
      if (c) c.innerHTML = '';
      if (ch) { ch.style.display = 'none'; ch.innerHTML = ''; }
    });

    // 2. Прикрепляем все загруженные файлы к созданной заявке
    var attachPromises = [];
    if (S.pendingPdfFile) {
      attachPromises.push(uploadAttachments(res.id, 'order_pdf', [S.pendingPdfFile]));
    }
    if (S.pendingSchemeFiles.length) {
      attachPromises.push(uploadAttachments(res.id, 'scheme', S.pendingSchemeFiles));
    }
    if (S.pendingChecklistFiles.length) {
      attachPromises.push(uploadAttachments(res.id, 'checklist', S.pendingChecklistFiles));
    }
    var attachPromise = attachPromises.length ? Promise.all(attachPromises) : Promise.resolve();

    attachPromise.then(function() {
      S.pendingPdfFile = null;
      S.pendingSchemeFiles = [];
      S.pendingChecklistFiles = [];
      updateDocTabBadges();

      var pdfEmpty = document.getElementById('ai_pdf_empty_msg');
      if (pdfEmpty) pdfEmpty.style.display = 'block';
      ['scheme', 'checklist'].forEach(function(docType) {
        var em = document.getElementById('nt_' + docType + '_empty_msg');
        if (em) em.style.display = 'block';
      });
      switchDocTab('pdf');

      // 3. Показываем всплывающее уведомление (Toast) об успехе
      var toast = document.createElement('div');
      toast.innerHTML = '✅ Заявка ' + res.id + ' успешно создана!';
      toast.style.cssText = 'position:fixed; bottom:20px; right:20px; background:var(--green); color:#fff; padding:12px 24px; border-radius:8px; box-shadow:var(--shadow); z-index:9999; font-weight:600; transition:opacity 0.3s;';
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; setTimeout(function(){ toast.remove(); }, 300); }, 3000);

      // 4. Обновляем список задач с сервера и открываем карточку новой заявки
      api('/tasks').then(function(tasksList) {
        S.tasks = tasksList;
        openCard(res.id);
      });
    }).catch(function(err) {
      console.error('Ошибка прикрепления файлов:', err);
      S.pendingPdfFile = null;
      S.pendingSchemeFiles = [];
      S.pendingChecklistFiles = [];
      updateDocTabBadges();
      var pdfEmpty = document.getElementById('ai_pdf_empty_msg');
      if (pdfEmpty) pdfEmpty.style.display = 'block';
      ['scheme', 'checklist'].forEach(function(docType) {
        var em = document.getElementById('nt_' + docType + '_empty_msg');
        if (em) em.style.display = 'block';
      });
      switchDocTab('pdf');

      // Даже если файлы не прикрепились, заявку всё равно открываем
      api('/tasks').then(function(tasksList) {
        S.tasks = tasksList;
        openCard(res.id);
      });
    });

  }).catch(function(e) {
    btn.innerHTML = originalBtnText;
    btn.disabled = false;
    alert('Системная ошибка: ' + e.message);
  });
}

// --- ЛОГИКА МЕССЕНДЖЕРА ---
function initChatSocket() {
  if (S.socket) return;
  if (typeof io === 'undefined') return console.error('Socket.io client script not loaded');

  S.socket = io();

  // При входе регистрируем ID нашего пользователя на сервере
  if (S.user && S.user.id) {
    S.socket.emit('init-user', S.user.id);
  }

  S.socket.on('new-message', function(msg) {
    if (String(msg.room_id) === String(S.activeRoomId)) {
      S.chatMessages = S.chatMessages || [];
      // Защита: добавляем только если такого сообщения еще нет в списке
      if (!S.chatMessages.some(m => m.id === msg.id)) {
        S.chatMessages.push(msg);
        renderChatMessages();
        scrollChatToBottom();
      }
    }
  });
  S.socket.on('ai-log', function(data) {
    var content = document.getElementById('ai_log_content');
    var box = document.getElementById('ai_log_box');
    if (content && box) {
      var time = new Date().toLocaleTimeString('ru', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      var line = document.createElement('div');
      line.style.marginBottom = '2px';
      line.innerHTML = '<span style="color:#71717a">[' + time + ']</span> ' + escHtml(data.message);
      content.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }
  });
  S.socket.on('ai-parse-result', function(data) {
    var btn = S.aiParserBtn;
    var inputEl = S.aiParserInput;
    
    var logBox = document.getElementById('ai_log_box');
    if (logBox) logBox.classList.remove('terminal-pulse');
    if (inputEl) inputEl.value = '';

    // Сброс кнопки (она крутила спиннер во время обработки)
    if (btn && S.aiParserBtnText) {
      btn.innerHTML = S.aiParserBtnText;
      btn.disabled = false;
    }

    if (data.error) {
      alert('Ошибка ИИ: ' + data.error);
      return;
    }

    // Автозаполнение полей
    if (data.id) document.getElementById('nt_id').value = data.id;
    if (data.vsp) document.getElementById('nt_vsp').value = data.vsp;
    if (data.region) document.getElementById('nt_region').value = data.region;
    if (data.address) document.getElementById('nt_address').value = data.address;
    if (data.workType) document.getElementById('nt_workType').value = data.workType;
    if (data.dateZayavki) document.getElementById('nt_dateZayavki').value = data.dateZayavki;
    if (data.amount) document.getElementById('nt_amount').value = data.amount;
    if (data.inOrder) document.getElementById('nt_inOrder').value = data.inOrder;
    if (data.manager) document.getElementById('nt_manager').value = data.manager;
    if (data.contact) document.getElementById('nt_contact').value = data.contact;
    if (data.comment) document.getElementById('nt_comment').value = data.comment;

    // Факт оставляем пустым!

    // Авторасчет: Стоимость за ед. = Сумма с НДС / Порты
    if (data.amount && data.inOrder && Number(data.inOrder) > 0) {
      document.getElementById('nt_pricePerUnit').value = Math.round(Number(data.amount) / Number(data.inOrder));
    }

    // Подсветка зеленым заполненных полей
    ['nt_id', 'nt_vsp', 'nt_region', 'nt_address', 'nt_manager', 'nt_contact', 'nt_workType', 'nt_inOrder', 'nt_dateZayavki', 'nt_amount', 'nt_pricePerUnit', 'nt_comment'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el && el.value) {
        el.style.backgroundColor = '#e8f5e9';
        setTimeout(function(){ el.style.backgroundColor = '#fff'; }, 2000);
      }
    });
  });
}

function openChatRoom(roomId, title) {
  S.activeRoomId = roomId;
