<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockeasy</title>
  
  <!-- ИКОНКА ДЛЯ ВКЛАДКИ БРАУЗЕРА И ТЕЛЕФОНА -->
  <link rel="icon" type="image/x-icon" href="images/logo.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="images/logo.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --orange: #FF6200;
      --orange-dark: #CC4E00;
      --orange-bg: #FFF4EE;
      --green: #22C55E;
      --green-bg: #F0FDF4;
      --red: #EF4444;
      --blue: #3B82F6;
      --yellow: #F59E0B;
      --bg: #F4F4F5;
      --surface: #FFFFFF;
      --border: #E4E4E7;
      --text: #18181B;
      --text-2: #52525B;
      --text-3: #A1A1AA;
      --radius: 10px;
      --shadow: 0 1px 8px rgba(0,0,0,0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Golos Text', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

    /* APP LAYOUT */
    .app-layout {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background: var(--bg);
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #18181B;
      color: #F4F4F5;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 120;
      border-right: 1px solid #27272A;
      user-select: none;
    }
    .sidebar.collapsed {
      width: 64px;
    }

    /* SIDEBAR HEADER */
    .sidebar-header {
      height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272A;
      flex-shrink: 0;
      position: relative;
    }
    .sidebar.collapsed .sidebar-header {
      padding: 0;
      justify-content: center;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.2px;
      color: #FFFFFF;
      overflow: hidden;
      white-space: nowrap;
      user-select: none;
    }
    .sidebar-logo-icon-wrap {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .sidebar-logo-icon-wrap img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
      transition: opacity 0.15s ease;
    }
    .sidebar-logo-hint {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: var(--orange);
      color: #FFFFFF;
      font-size: 0.85rem;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(255, 98, 0, 0.4);
    }
    .sidebar.collapsed .sidebar-logo {
      cursor: pointer;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar.collapsed .sidebar-logo:hover .sidebar-logo-icon-wrap {
      box-shadow: 0 0 0 2px var(--orange);
    }
    .sidebar.collapsed .sidebar-logo:hover .sidebar-logo-icon-wrap img {
      opacity: 0;
    }
    .sidebar.collapsed .sidebar-logo:hover .sidebar-logo-hint {
      display: flex;
    }
    .sidebar.collapsed .logo-text {
      display: none;
    }
    .sidebar.collapsed .sidebar-collapse-btn {
      display: none;
    }
    .sidebar-collapse-btn {
      background: none;
      border: none;
      color: #71717A;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar-collapse-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
    }

    /* SIDEBAR NAVIGATION */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-sec-title {
      font-size: 0.68rem;
      font-weight: 700;
      color: #71717A;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 14px 10px 4px;
      white-space: nowrap;
      overflow: hidden;
    }
    .sidebar.collapsed .sidebar-sec-title {
      display: none;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      background: none;
      border: none;
      color: #A1A1AA;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
      text-decoration: none;
    }
    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #FFFFFF;
    }
    .sidebar-item.active {
      background: rgba(255, 98, 0, 0.18);
      color: var(--orange);
      font-weight: 600;
    }
    .sidebar-item-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #A1A1AA;
      transition: color 0.12s;
    }
    .sidebar-item:hover .sidebar-item-icon {
      color: #FFFFFF;
    }
    .sidebar-item.active .sidebar-item-icon {
      color: var(--orange);
    }
    .sidebar-item-icon svg, .topbar-title-icon svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.85px;
      display: block;
    }
    .topbar-title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--orange);
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .sidebar-item-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar.collapsed .sidebar-item-label {
      display: none;
    }
    .sidebar.collapsed .sidebar-item {
      justify-content: center;
      padding: 8px 0;
    }

    /* SIDEBAR SUBMENU */
    .sidebar-submenu {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-left: 28px;
      margin-top: 2px;
      margin-bottom: 4px;
      border-left: 1.5px solid #27272A;
      padding-left: 8px;
    }
    .sidebar.collapsed .sidebar-submenu {
      display: none !important;
    }
    .sidebar-subitem {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      font-size: 0.8rem;
      color: #A1A1AA;
      background: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .sidebar-subitem:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #FFFFFF;
    }
    .sidebar-subitem.active {
      color: var(--orange);
      font-weight: 600;
      background: rgba(255, 98, 0, 0.12);
    }
    .sidebar-arrow {
      margin-left: auto;
      font-size: 0.7rem;
      transition: transform 0.2s ease;
      color: #71717A;
    }
    .sidebar-arrow.open {
      transform: rotate(90deg);
      color: var(--orange);
    }

    /* BADGES FOR CONTRACTOR TYPES */
    .b-customer { background: #dbeafe; color: #1d4ed8; }
    .b-executor { background: #ffedd5; color: #c2410c; }
    .b-supplier { background: #dcfce7; color: #15803d; }
    .b-internal { background: #f3e8ff; color: #7e22ce; }

    /* SIDEBAR FOOTER (USER & LOGOUT) */
    .sidebar-footer {
      border-top: 1px solid #27272A;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      overflow: hidden;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sidebar-user:hover {
      background: rgba(255, 255, 255, 0.09);
    }
    .sidebar-user.active {
      background: rgba(255, 98, 0, 0.2);
      outline: 1px solid var(--orange);
    }
    .sidebar-user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--orange);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .sidebar-user-info {
      flex: 1;
      overflow: hidden;
      line-height: 1.25;
    }
    .sidebar-user-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #FFFFFF;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-user-role {
      font-size: 0.68rem;
      color: #71717A;
    }
    .sidebar.collapsed .sidebar-user-info {
      display: none;
    }
    .sidebar.collapsed .sidebar-user {
      justify-content: center;
      padding: 6px 0;
      background: none;
    }
    .sidebar-logout-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      background: none;
      border: none;
      color: var(--red);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s;
      white-space: nowrap;
    }
    .sidebar-logout-btn:hover {
      background: rgba(239, 68, 68, 0.12);
    }
    .sidebar.collapsed .sidebar-logout-btn .sidebar-item-label {
      display: none;
    }
    .sidebar.collapsed .sidebar-logout-btn {
      justify-content: center;
      padding: 7px 0;
    }

    /* CONTENT AREA & TOPBAR */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-x: hidden;
    }
    .topbar {
      height: 54px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text);
      padding: 4px 6px;
      line-height: 1;
      border-radius: 6px;
    }
    .topbar-menu-btn:hover {
      background: var(--bg);
    }
    .topbar-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-icon-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px 8px;
      position: relative;
      border-radius: 7px;
      transition: background 0.12s;
      line-height: 1;
    }
    .topbar-icon-btn:hover {
      background: var(--bg);
    }
    .notif-badge {
      position: absolute;
      top: 0;
      right: 2px;
      background: var(--red);
      color: #fff;
      font-size: .65rem;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 5px;
      line-height: 1;
    }
    .notif-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      width: 320px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 200;
      max-height: 380px;
      overflow-y: auto;
      color: var(--text);
    }
    .notif-dropdown-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: .85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* LAYOUT & GRIDS */
    .main { padding: 1.25rem; max-width: 100%; flex: 1; }
    .page-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.25rem; }

    /* SURFACE */
    .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
    .p { padding: 1.25rem; }

    /* GRID & ADAPTIVE */
    .g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; margin-bottom: 1rem; }
    .g2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 1rem; }
    .row { display: flex; align-items: center; gap: .75rem; }
    .mb { margin-bottom: 1rem; }

    /* ADAPTIVE BREAKPOINTS */
    @media (max-width: 1100px) {
      .g4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 900px) {
      .g2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        bottom: 0;
        width: 260px !important;
        transition: left 0.25s ease;
        z-index: 500;
      }
      .sidebar.mobile-open {
        left: 0;
      }
      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 490;
      }
      .sidebar-backdrop.active {
        display: block;
      }
      .topbar-menu-btn {
        display: inline-flex;
      }
      .sidebar-collapse-btn {
        display: none;
      }
      .g4 { grid-template-columns: 1fr; }
    }

    .unsaved-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
      background: var(--surface); border-top: 1px solid var(--orange);
      padding: .75rem 1.5rem; display: flex; align-items: center; gap: 1rem;
      justify-content: center;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 600;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-box {
      background: var(--surface); border-radius: 8px; padding: 1.5rem;
      max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto;
    }

    /* STAT */
    .stat { padding: 1.1rem 1.25rem; }
    .stat-lbl { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); margin-bottom: .4rem; }
    .stat-val { font-size: 1.9rem; font-weight: 700; color: var(--orange); line-height: 1; }
    .stat-sub { font-size: .8rem; color: var(--text-2); margin-top: .3rem; }

    /* PROGRESS */
    .prog { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: .6rem; }
    .prog-fill { height: 100%; background: var(--orange); border-radius: 3px; }
    .prog-fill.g { background: var(--green); }

    /* BADGE */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 600; }
    .b-red { background: #FEE2E2; color: #B91C1C; }
    .b-orange { background: #FFEDD5; color: #C2410C; }
    .b-green { background: #DCFCE7; color: #15803D; }
    .b-gray { background: #F4F4F5; color: #71717A; }
    .b-blue { background: #DBEAFE; color: #1D4ED8; }
    .b-request { background: #F1F5F9; color: #475569; }
    .b-survey { background: #F3E8FF; color: #7E22CE; }
    .b-install { background: #FFEDD5; color: #C2410C; }
    .b-control { background: #FEF3C7; color: #B45309; }
    .b-acceptance { background: #E0F2FE; color: #0369A1; }
    .b-payment { background: #DCFCE7; color: #15803D; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; gap: 5px; background: var(--orange); color: #fff; border: none; padding: 7px 15px; border-radius: 7px; cursor: pointer; font-family: inherit; font-size: .85rem; font-weight: 600; transition: background .12s; white-space: nowrap; text-decoration: none; }
    .btn:hover { background: var(--orange-dark); }
    .btn-sm { padding: 4px 11px; font-size: .78rem; }
    .btn-ghost { background: transparent; color: var(--orange); border: 1.5px solid var(--orange); }
    .btn-ghost:hover { background: var(--orange-bg); }
    .btn-icon { padding: 5px 9px; }
    .td-clip { max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .btn-link { background:none;border:none;color:var(--orange-dark);font-weight:700;font-size:.82rem;cursor:pointer;padding:2px 4px;border-radius:4px;white-space:nowrap;font-family:inherit; }
    .btn-link:hover { background:var(--orange-bg); }
    .field-row { display:grid;grid-template-columns:180px 1fr;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--border);align-items:start; }
    .field-lbl { font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);padding-top:4px; }
    .field-val { font-size:.875rem;color:var(--text); }
    .field-val input,.field-val select,.field-val textarea { width:100%;padding:5px 9px;font-size:.875rem; }
    .field-val textarea { resize:vertical;min-height:80px; }
    .card-hdr { display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap; }
    .card-hdr h1 { margin:0;flex:1;font-size:1.1rem; }
    .hist-item { font-size:.78rem;color:var(--text-2);padding:.35rem 0;border-bottom:1px solid var(--border); }

    /* INPUTS */
    input, select, textarea { font-family: inherit; font-size: .875rem; border: 1.5px solid var(--border); border-radius: 7px; padding: 7px 11px; color: var(--text); background: #fff; outline: none; transition: border-color .12s; }
    input:focus, select:focus { border-color: var(--orange); }
    select { cursor: pointer; }

    /* TABLE */
    .tbl-wrap { 
      overflow: auto; 
      max-height: 80vh; 
      border-radius: var(--radius); 
      resize: vertical; 
      border-bottom: 2px solid var(--border);
      scrollbar-width: thin;
      scrollbar-color: var(--orange) #f1f1f1;
    }
    .tbl-wrap::-webkit-scrollbar, .kanban::-webkit-scrollbar, .chain-steps::-webkit-scrollbar {
      height: 10px;
      width: 10px;
    }
    .tbl-wrap::-webkit-scrollbar-track, .kanban::-webkit-scrollbar-track, .chain-steps::-webkit-scrollbar-track {
      background: #f1f1f5;
      border-radius: 5px;
    }
    .tbl-wrap::-webkit-scrollbar-thumb, .kanban::-webkit-scrollbar-thumb, .chain-steps::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 5px;
    }
    .tbl-wrap::-webkit-scrollbar-thumb:hover, .kanban::-webkit-scrollbar-thumb:hover, .chain-steps::-webkit-scrollbar-thumb:hover {
      background: var(--orange);
    }
    table { width: 100%; min-width: 980px; border-collapse: collapse; font-size: .82rem; }
    thead th { background: #FAFAFA; position: sticky; top: 0; z-index: 10; padding: 9px 11px; text-align: left; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-3); border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody td { padding: 8px 11px; border-bottom: 1px solid #F4F4F5; vertical-align: middle; }
    tbody tr:hover td { background: var(--orange-bg); }
    tbody tr:last-child td { border-bottom: none; }

    /* CHAIN */
    .chain-steps { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .step { display: flex; flex-direction: column; align-items: center; background: #fff; border: 2px solid var(--border); border-radius: 9px; padding: 9px 12px; min-width: 76px; text-align: center; font-size: .78rem; font-weight: 600; }
    .step.done { background: var(--green-bg); border-color: var(--green); color: #15803D; }
    .step.active { background: var(--orange-bg); border-color: var(--orange); color: var(--orange-dark); }
    .step-icon { font-size: 1.1rem; margin-bottom: 3px; }
    .chain-arr { color: var(--text-3); flex-shrink: 0; }

    /* REGION ROWS */
    .rrow { display: flex; align-items: center; gap: .75rem; padding: 8px 12px; border-radius: 7px; cursor: pointer; transition: background .1s; border: 1.5px solid transparent; }
    .rrow:hover { background: var(--orange-bg); }
    .rrow.sel { background: var(--orange-bg); border-color: var(--orange); }
    .rname { font-weight: 600; min-width: 110px; font-size: .82rem; }
    .rstats { display: flex; gap: .6rem; font-size: .78rem; flex: 1; }
    .rprog { flex: 1; min-width: 70px; }
    .ramt { font-size: .78rem; color: var(--text-2); white-space: nowrap; }

    /* KANBAN */
    .kanban { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: .5rem; }
    .kcol { min-width: 220px; flex-shrink: 0; }

// ─── API ──────────────────────────────────────────────────────────────────────
function api(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (S.token) {
    opts.headers['Authorization'] = 'Bearer ' + S.token;
  }
  return fetch('/api' + url, opts).then(function(r){ 
    if (r.status === 401 || r.status === 403) { // Добавили 403
      localStorage.clear();
      location.reload();
      return new Promise(function(){}); // Останавливаем выполнение, ждем перезагрузки
    }
    return r.json(); 
  }).catch(function(err) {
    console.error("API Network Error:", err);
    return { error: 'Network error' };
  });
}

function uploadAttachments(taskId, type, files, comment) {
  var fd = new FormData();
  for (var i = 0; i < files.length; i++) fd.append('files', files[i]);
  fd.append('type', type);
  if (comment) fd.append('comment', comment);
  return fetch('/api/tasks/' + taskId + '/attachments', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + S.token }, // без Content-Type — браузер сам поставит multipart boundary
    body: fd
  }).then(function(r){ return r.json(); });
}

function loadAttachments(taskId) {
  return api('/tasks/' + taskId + '/attachments');
}

function deleteAttachment(attId) {
  return api('/attachments/' + attId, { method: 'DELETE' });
}


// ─── BOOT ─────────────────────────────────────────────────────────────────────
function init() {
  renderNav();
  if (!S.token) {
    renderApp();
    return;
  }

  loadNotifications();
  if (!window.notifInterval) {
    window.notifInterval = setInterval(loadNotifications, 30000);
  }

  initChatSocket();
  
  setApp('<div class="spin-wrap"><div class="spin"></div><p style="margin-top:.75rem">Загрузка…</p></div>');
  var requests = [api('/stats'), api('/tasks'), api('/chains'), api('/import-info'), api('/marches')];
  // Загружаем список пользователей только если зашел Админ
  if (S.user && S.user.role === 'admin') {
    requests.push(api('/users'));
    requests.push(api('/contractors'));
  }

  Promise.all(requests).then(function(res) {
    S.stats = res[0]; S.tasks = res[1]; S.chains = res[2]; S.importInfo = res[3]; S.marches = res[4];
    if (res[5]) S.users = res[5]; // Сохраняем пользователей, если они загрузились
    if (res[6]) S.contractors = res[6];
    
    if (Array.isArray(S.chains) && S.chains.length) {
      var firstReal = S.chains.find(function(c){ return c.id && c.id !== '(без региона)'; });
      S.selChain = (firstReal || S.chains[0]).id;
    }
    renderApp();
  }).catch(function(err) {
    console.error("Init failed:", err);
    setApp('<div class="card p" style="text-align:center; color:var(--red)">Ошибка соединения с сервером. Пожалуйста, обновите страницу.</div>');
  });
}

function go(page) {
  S.page = page;
  toggleMobileSidebar(false);
  renderNav();
  renderApp();
}

// ─── SIDEBAR & NAV ───────────────────────────────────────────────────────────

function handleLogoClick() {
  var sb = document.getElementById('sidebar');
  if (sb && sb.classList.contains('collapsed')) {
    toggleSidebarCollapse();
  }
}

function toggleSidebarCollapse() {
  var sb = document.getElementById('sidebar');
  var logo = document.getElementById('sidebar-logo');
  if (!sb) return;
  var isCollapsed = sb.classList.toggle('collapsed');
  var icon = document.getElementById('collapse-icon');
  if (icon) icon.textContent = isCollapsed ? '▶' : '◀';
  if (logo) logo.title = isCollapsed ? 'Нажмите, чтобы развернуть меню' : 'Stockeasy';
  localStorage.setItem('sidebar_collapsed', isCollapsed ? 'true' : 'false');
}

function toggleMobileSidebar(open) {
  var sb = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebar-backdrop');
  if (!sb || !backdrop) return;
  if (open === undefined) {
    var isOpen = sb.classList.contains('mobile-open');
    sb.classList.toggle('mobile-open', !isOpen);
    backdrop.classList.toggle('active', !isOpen);
  } else {
    sb.classList.toggle('mobile-open', open);
    backdrop.classList.toggle('active', open);
  }
}

function renderNav() {
  var sb = document.getElementById('sidebar');
  var topbar = document.getElementById('topbar');
  var navEl = document.getElementById('sidebar-nav');
  var footerEl = document.getElementById('sidebar-footer');
  var topbarTitle = document.getElementById('topbar-title');
  var notifContainer = document.getElementById('notif-container');
  var logo = document.getElementById('sidebar-logo');

  // Если не авторизован — скрываем сайдбар и топбар
  if (!S.token) {
    if (sb) sb.style.display = 'none';
    if (topbar) topbar.style.display = 'none';
    return;
  }

  // Если авторизован — показываем сайдбар и топбар
  if (sb) sb.style.display = 'flex';
  if (topbar) topbar.style.display = 'flex';
  if (notifContainer) notifContainer.style.display = 'block';

  // Восстанавливаем сохраненное состояние сворачивания сайдбара
  var isCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
  if (sb) {
    if (isCollapsed) {
      sb.classList.add('collapsed');
      var icon = document.getElementById('collapse-icon');
      if (icon) icon.textContent = '▶';
      if (logo) logo.title = 'Нажмите, чтобы развернуть меню';
    } else {
      sb.classList.remove('collapsed');
      var icon = document.getElementById('collapse-icon');
      if (icon) icon.textContent = '◀';
      if (logo) logo.title = 'Stockeasy';
    }
  }

  // Обновляем заголовок в топбаре
  var curItem = NAV.find(function(it){ return it.id === S.page; });
  if (topbarTitle) {
    if (S.page === 'profile') {
      topbarTitle.innerHTML = '<span class="topbar-title-icon">' + ICONS.profile + '</span><span>Мой профиль</span>';
    } else if (curItem) {
      topbarTitle.innerHTML = '<span class="topbar-title-icon">' + curItem.icon + '</span><span>' + escHtml(curItem.label) + '</span>';
    } else {
      topbarTitle.innerHTML = 'Stockeasy';
    }
  }

  // Рендерим категории навигации
  if (navEl) {
    navEl.innerHTML = '';
    NAV_SECTIONS.forEach(function(sec) {
      // Фильтруем пункты по роли пользователя
      var visibleItems = sec.items.filter(function(item) {
        if (S.user && S.user.role === 'worker' && (item.id === 'dashboard' || item.id === 'data' || item.id === 'supply')) {
          return false;
        }
        if ((item.id === 'users' || item.id === 'logs' || item.id === 'contractors') && (!S.user || S.user.role !== 'admin')) {
          return false;
        }
        return true;
      });

      if (!visibleItems.length) return;

      // Заголовок секции
      var secTitle = document.createElement('div');
      secTitle.className = 'sidebar-sec-title';
      secTitle.textContent = sec.title;
      navEl.appendChild(secTitle);

      // Кнопки разделов
      visibleItems.forEach(function(item) {
        var isDashSub = S.page.startsWith('dash-');
        var isActive = S.page === item.id || (item.id === 'dashboard' && isDashSub);
        var isDashOpen = S.dashMenuOpen !== undefined ? S.dashMenuOpen : (isActive || isDashSub);

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sidebar-item' + (isActive ? ' active' : '');
        btn.title = item.label;

        var arrowHtml = item.hasChildren ? '<span class="sidebar-arrow' + (isDashOpen ? ' open' : '') + '">▶</span>' : '';
        btn.innerHTML = '<span class="sidebar-item-icon">' + item.icon + '</span><span class="sidebar-item-label">' + item.label + '</span>' + arrowHtml;

        btn.onclick = function(e) {
          if (item.hasChildren) {
            var sb = document.getElementById('sidebar');
            if (sb && sb.classList.contains('collapsed')) {
              toggleSidebarCollapse();
            }
            S.dashMenuOpen = !isDashOpen;
            if (S.page !== 'dashboard' && !S.page.startsWith('dash-')) {
              go('dashboard');
            } else {
              renderNav();
            }
          } else {
            go(item.id);
          }
        };
        navEl.appendChild(btn);

        // Рендерим подменю для Обзора
        if (item.hasChildren && item.children && isDashOpen) {
          var subWrap = document.createElement('div');
          subWrap.className = 'sidebar-submenu';
          item.children.forEach(function(sub) {
            var subActive = (sub.id === 'dash-summary' && S.page === 'dashboard') || (S.page === sub.id);
            var subBtn = document.createElement('button');
            subBtn.type = 'button';
            subBtn.className = 'sidebar-subitem' + (subActive ? ' active' : '');
            subBtn.textContent = sub.label;
            subBtn.onclick = function() {
              if (sub.id === 'dash-summary') go('dashboard');
              else go(sub.id);
            };
            subWrap.appendChild(subBtn);
          });
          navEl.appendChild(subWrap);
        }
      });
    });
  }

  // Рендерим футер сайдбара (пользователь + выход)
  if (footerEl) {
    var userName = (S.user && (S.user.fullName || S.user.username)) || 'Пользователь';
    var userRole = (S.user && S.user.role === 'admin') ? 'Администратор' : 'Исполнитель';
    var initial = (userName.trim()[0] || 'U').toUpperCase();
    var isProfileActive = S.page === 'profile';
    var avatarInner = (S.user && S.user.avatarUrl) 
      ? '<img src="' + escHtml(S.user.avatarUrl) + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.parentElement.innerHTML=\'' + initial + '\'">'
      : initial;

    footerEl.innerHTML = 
      '<div class="sidebar-user' + (isProfileActive ? ' active' : '') + '" onclick="go(\'profile\')" title="' + escHtml(userName) + ' (' + userRole + ') — Профиль">' +
        '<div class="sidebar-user-avatar">' + avatarInner + '</div>' +
        '<div class="sidebar-user-info">' +
          '<div class="sidebar-user-name">' + escHtml(userName) + '</div>' +
          '<div class="sidebar-user-role">' + userRole + '</div>' +
        '</div>' +
      '</div>' +
      '<button type="button" class="sidebar-logout-btn" onclick="doLogout()" title="Выйти из аккаунта">' +
        '<span class="sidebar-item-icon">' + ICONS.logout + '</span>' +
        '<span class="sidebar-item-label">Выход</span>' +
      '</button>';
  }
}

  location.reload();

function setApp(html) { document.getElementById('app').innerHTML = html; }
// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderApp() {
  if (!S.token) {
    setApp(pageLogin());
    return;
  }
  // 1. ЗАПОМИНАЕМ ФОКУС (Безопасно)
  var activeEl = document.activeElement;
  var activeId = (activeEl && activeEl.id) ? activeEl.id : null;
  var start = null, end = null;
  
  // Проверяем, поддерживает ли элемент выделение (только для текстовых инпутов)
  try {
    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
      start = activeEl.selectionStart;
      end = activeEl.selectionEnd;
    }
  } catch (e) {
    // Игнорируем, если элемент не поддерживает выбор (например, чекбоксы)
  }

  // 2. Отрисовка страницы
  if      (S.page === 'dashboard' || S.page.startsWith('dash-')) setApp(pageDash());
  else if (S.page === 'users')     setApp(pageUsers());
  else if (S.page === 'logs')      setApp(pageLogs());
  else if (S.page === 'chat')      setApp(pageChat());
  else if (S.page === 'contractors') setApp(pageContractors());
  else if (S.page === 'supply')    setApp(pageSupply());
  else if (S.page === 'kanban')    setApp(pageKanban());
  else if (S.page === 'tasks')     setApp(pageTasks());
  else if (S.page === 'card')      setApp(pageCard());
  else if (S.page === 'data')      setApp(pageData());
  else if (S.page === 'marches')   setApp(pageMarches());
  else if (S.page === 'march-detail') setApp(pageMarchDetail());
  else if (S.page === 'profile')   setApp(pageProfile());

  // 3. Вешаем события заново
  bindEvents();

  // 4. ВОЗВРАЩАЕМ ФОКУС
  if (activeId) {
    var el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (start !== null && el.setSelectionRange) {
        try { el.setSelectionRange(start, end); } catch(e) {}
      }
    }
  }
}

function loadNotifications() {
  if (!S.token) return;
  api('/notifications').then(function(list) {
    if (!Array.isArray(list)) return;
    S.notifications = list;
    
    var unreadCount = list.filter(n => !n.is_read).length;
    var badge = document.getElementById('notif-badge');
    var container = document.getElementById('notif-container');

    if (container) container.style.display = 'block';
    
    if (badge) {
      if (unreadCount > 0) {
        badge.textContent = unreadCount;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    }
  });
}

function toggleNotifications() {
  var box = document.getElementById('notif-dropdown');
  if (!box) return;
  var isHidden = box.style.display === 'none';

  if (isHidden) {
    // 1. Сначала запрашиваем СВЕЖИЕ уведомления с сервера
    api('/notifications').then(function(list) {
      if (Array.isArray(list)) {
        S.notifications = list;
        
        // Обновляем бейдж с цифрой
        var unreadCount = list.filter(n => !n.is_read).length;
        var badge = document.getElementById('notif-badge');
        if (badge) {
          badge.textContent = unreadCount;
          badge.style.display = unreadCount > 0 ? 'inline-block' : 'none';
        }

        // Рендерим список
        var items = list.map(function(n) {
          var bg = n.is_read ? '#fff' : 'var(--orange-bg)';
          var relatedTask = n.link ? S.tasks.find(function(x){ return String(x.id) === String(n.link); }) : null;
          var showActions = relatedTask && relatedTask.assignmentStatus === 'pending' && relatedTask.assignee === (S.user.fullName || '');
          var actionsHtml = showActions
            ? '<div style="display:flex;gap:.4rem;margin-top:6px" onclick="event.stopPropagation()">' +
                '<button class="btn btn-sm" onclick="acceptTaskFromNotif(\'' + n.link + '\')">✅ Принять</button>' +
                '<button class="btn btn-sm btn-ghost" style="color:var(--red)" onclick="declineTaskFromNotif(\'' + n.link + '\')">❌ Отказаться</button>' +
              '</div>'
            : '';
          return `
            <div style="padding:10px 14px; border-bottom:1px solid #f4f4f5; background:${bg}; cursor:pointer" onclick="openNotifLink('${n.link || ''}')">
              <div style="font-weight:600; color:var(--text); margin-bottom:2px">${n.title}</div>
              <div style="color:var(--text-2); font-size:.75rem">${n.body || ''}</div>
              <div style="color:var(--text-3); font-size:.65rem; margin-top:4px">${new Date(n.created_at).toLocaleString('ru')}</div>
              ${actionsHtml}
            </div>
          `;
        }).join('');
        
        document.getElementById('notif-list').innerHTML = items || '<div style="padding:15px; text-align:center; color:var(--text-3)">Нет уведомлений</div>';
      }
      box.style.display = 'block';
    });
  } else {
    box.style.display = 'none';
  }
}

function levenshtein(a, b) {
  var tmp;
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  if (a.length > b.length) { tmp = a; a = b; b = tmp; }
  var row = Array.from({length: a.length + 1}, (_, i) => i);
  for (var i = 1; i <= b.length; i++) {
    var prev = i;
    for (var j = 1; j <= a.length; j++) {
      var val = b[i-1] === a[j-1] ? row[j-1] : Math.min(row[j-1] + 1, prev + 1, row[j] + 1);
      row[j-1] = prev; prev = val;
    }
    row[a.length] = prev;
  }
  return row[a.length];
}

// Ищет колонку, наиболее похожую на искомую
function findColFuzzy(row, targetName) {
  var keys = Object.keys(row);
  var bestMatch = null;
  var minDistance = 3; // Порог точности (3 опечатки максимум)

  var normTarget = targetName.toLowerCase().replace(/[^а-яёa-z0-9]/g, '');

  for (var key of keys) {
    var normKey = key.toLowerCase().replace(/[^а-яёa-z0-9]/g, '');
    // Если есть точное вхождение подстроки (например, "адрес" в "адрес объекта")
    if (normKey.includes(normTarget) || normTarget.includes(normKey)) return row[key];

    // Иначе считаем расстояние Левенштейна
    var dist = levenshtein(normKey, normTarget);
    if (dist < minDistance) {
      minDistance = dist;
      bestMatch = row[key];
    }
  }
  return bestMatch;
}

function highlight(text, query) {
  if (!query || !text) return text;
  // Разбиваем поиск на отдельные слова, чтобы подсвечивать каждое
  var words = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return text;
  
  var escapedWords = words.map(function(w) { 
    return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
  });
  var regex = new RegExp('(' + escapedWords.join('|') + ')', 'gi');
  
  return String(text).replace(regex, '<mark style="background:#ffeb3b; padding:0 2px; border-radius:2px; color:#000;">$1</mark>');
}

function getTaskFinance(t) {
  var work = Math.round((Number(t.fact) || 0) * (Number(t.pricePerUnit) || 0));
  // Берем готовые рубли прямо из базы (без умножения на тарифы)
  var transport = Number(t.distanceKm) || 0; 
  var extras = Number(t.extras) || 0;
  
  var po = work + transport + extras;
  var tmc = Number(t.tmc) || 0;
  
  return {
    po: po,
    tmc: tmc,
    total: po + tmc,
    details: 'Работа: ' + fmtMoney(work) + ' + Транспорт: ' + fmtMoney(transport) + ' + Допы: ' + fmtMoney(extras)
  };
}

  var v = m[p] || ['b-gray', p||'—']; return badge(v[0], v[1]);
}
function calculateTransport(km, customRate) {
  if (!km || km <= 0) return 0;
  if (customRate && customRate > 0) return Math.round(km * 2 * customRate);

  var rate = 0;
  if (km > 200) rate  = 35;
  else if (km > 100) rate = 30;
  else if (km > 50)  rate = 25;
  else if (km > 10)  rate = 15;

  return Math.round(km * 2 * rate);
}

function updateProfileAvatarDisplay(url) {
  var previewEl = document.getElementById('profile_avatar_preview');
  var btnDel = document.getElementById('btn_delete_avatar');
  var userName = (S.user && (S.user.fullName || S.user.username)) || 'Пользователь';
  var initial = (userName.trim()[0] || 'U').toUpperCase();

  if (previewEl) {
    if (url) {
      previewEl.innerHTML = '<img src="' + escHtml(url) + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML=\'' + initial + '\'">';
    } else {
      previewEl.innerHTML = initial;
    }
  }
  if (btnDel) {
    btnDel.style.display = url ? 'inline-flex' : 'none';
  }
}

function saveProfileData() {
  var fullName = (document.getElementById('prof_full_name').value || '').trim();
  var email = (document.getElementById('prof_email').value || '').trim();
  var statusEl = document.getElementById('profile_info_status');

  if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-2);">Сохранение…</span>';

  api('/profile', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fullName: fullName, email: email })
  }).then(function(res) {
    if (!res || res.error) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">' + (res ? res.error : 'Ошибка сохранения') + '</span>';
      return;
    }

    // Обновляем локальное состояние пользователя
    S.user = Object.assign({}, S.user, {
      fullName: res.user.full_name,
      email: res.user.email
    });
    localStorage.setItem('user', JSON.stringify(S.user));

    renderNav();
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--green);font-weight:600;">✓ Данные успешно сохранены</span>';
    setTimeout(function() {
      if (statusEl) statusEl.innerHTML = '';
    }, 4000);
  }).catch(function(err) {
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">Ошибка сети</span>';
  });
}

function changeProfilePassword() {
  var curPass = document.getElementById('prof_cur_pass').value;
  var newPass = document.getElementById('prof_new_pass').value;
  var newPass2 = document.getElementById('prof_new_pass2').value;
  var statusEl = document.getElementById('profile_pass_status');

  if (!curPass) {
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">Введите текущий пароль</span>';
    return;
  }
  if (!newPass || newPass.length < 6) {
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">Новый пароль должен быть не менее 6 символов</span>';
    return;
  }
  if (newPass !== newPass2) {
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">Новые пароли не совпадают</span>';
    return;
  }

  if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-2);">Проверка и смена…</span>';

  api('/profile', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      currentPassword: curPass,
      newPassword: newPass
    })
  }).then(function(res) {
    if (!res || res.error) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">' + (res ? res.error : 'Ошибка смены пароля') + '</span>';
      return;
    }

    document.getElementById('prof_cur_pass').value = '';
    document.getElementById('prof_new_pass').value = '';
    document.getElementById('prof_new_pass2').value = '';

    if (statusEl) statusEl.innerHTML = '<span style="color:var(--green);font-weight:600;">✓ Пароль успешно изменён!</span>';
    setTimeout(function() {
      if (statusEl) statusEl.innerHTML = '';
    }, 5000);
  }).catch(function(err) {
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">Ошибка сети</span>';
  });
}

function handleAvatarSelected(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];

  if (file.size > 5 * 1024 * 1024) {
    alert('Размер файла превышает 5 МБ');
    input.value = '';
    return;
  }

  var statusEl = document.getElementById('avatar_upload_status');
  if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-2);">Загрузка…</span>';

  var fd = new FormData();
  fd.append('avatar', file);

  fetch('/api/profile/avatar', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + S.token },
    body: fd
  }).then(function(r) { return r.json(); })
    .then(function(res) {
      input.value = '';
      if (!res || res.error) {
        if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">' + (res ? res.error : 'Ошибка загрузки') + '</span>';
        return;
      }

      // Обновляем состояние пользователя
      S.user = Object.assign({}, S.user, { avatarUrl: res.avatarUrl });
      localStorage.setItem('user', JSON.stringify(S.user));

      updateProfileAvatarDisplay(res.avatarUrl);
      renderNav();

      if (statusEl) statusEl.innerHTML = '<span style="color:var(--green);font-weight:600;">✓ Фото обновлено</span>';
      setTimeout(function() {
        if (statusEl) statusEl.innerHTML = '';
      }, 4000);
    }).catch(function(err) {
      input.value = '';
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">Ошибка сети при загрузке фото</span>';
    });
}

function deleteAvatar() {
  if (!confirm('Вы уверены, что хотите удалить фото профиля?')) return;
  var statusEl = document.getElementById('avatar_upload_status');
  if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-2);">Удаление…</span>';

  api('/profile/avatar', { method: 'DELETE' })
    .then(function(res) {
      if (!res || res.error) {
        if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">' + (res ? res.error : 'Ошибка удаления') + '</span>';
        return;
      }

      // Очищаем аватарку
      S.user = Object.assign({}, S.user, { avatarUrl: null });
      localStorage.setItem('user', JSON.stringify(S.user));

      updateProfileAvatarDisplay(null);
      renderNav();

      if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-2);">Фото удалено</span>';
      setTimeout(function() {
        if (statusEl) statusEl.innerHTML = '';
      }, 3000);
    }).catch(function(err) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--red)">Ошибка сети</span>';
    });
}

// ─── ЛОГИКА МЕССЕНДЖЕРА ───────────────────────────────────────────────────────
function initChatSocket() {
  if (S.socket) return;
  if (typeof io === 'undefined') {
    console.warn('Socket.io script not loaded yet');
    return;
  }

  S.socket = io();

  if (S.user && S.user.id) {
    S.socket.emit('init-user', S.user.id);
  }

  S.socket.on('new-message', function(msg) {
    if (String(msg.room_id) === String(S.activeRoomId)) {
      S.chatMessages = S.chatMessages || [];
      S.chatMessages.push(msg);
      renderChatMessages();
      scrollChatToBottom();
    }
  });
}

function openGeneralChat() {
  if (!S.chatList || !S.chatList.generalChat) return;
  openChatRoom(S.chatList.generalChat.id, '📢 Общий чат компании');
}

function openDirectChat(targetUserId, targetName, targetAvatarUrl) {
  api('/chats/direct', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ targetUserId: targetUserId })
  }).then(function(res) {
    if (res && res.roomId) {
      var headerHtml = '';
      if (targetAvatarUrl) {
        headerHtml = '<img src="' + escHtml(targetAvatarUrl) + '" style="width:28px;height:28px;border-radius:50%;object-fit:cover;"> ' + escHtml(targetName);
      } else {
        headerHtml = '💬 ' + escHtml(targetName);
      }
      openChatRoom(res.roomId, headerHtml);
    }
  });
}

function openChatRoom(roomId, titleHtml) {
  S.activeRoomId = roomId;
  var titleEl = document.getElementById('chat-title');
  if (titleEl) titleEl.innerHTML = titleHtml;
  var inputArea = document.getElementById('chat-input-area');
  if (inputArea) inputArea.style.display = 'flex';

  if (S.socket) S.socket.emit('join-room', roomId);

  api('/chats/' + roomId + '/messages').then(function(messages) {
    S.chatMessages = messages || [];
    renderChatMessages();
    scrollChatToBottom();
  });
}

function renderChatMessages() {
  var box = document.getElementById('chat-messages');
  if (!box) return;

  if (!S.chatMessages || !S.chatMessages.length) {
    box.innerHTML = '<div style="text-align:center; color:var(--text-3); margin-top:2rem">Нет сообщений. Напишите первым!</div>';
    return;
  }

  var currentUserId = S.user ? S.user.id : null;

  var html = S.chatMessages.map(function(m) {
    var isMe = (m.sender_id === currentUserId || (S.user && m.username === S.user.username));
    var bg = isMe ? 'var(--orange-bg)' : '#fff';
    var align = isMe ? 'flex-end' : 'flex-start';
    var border = isMe ? '1px solid #fed7aa' : '1px solid var(--border)';
    var time = new Date(m.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    var senderName = isMe ? 'Вы' : (m.full_name || m.username || 'Пользователь');
    var initial = (senderName.trim()[0] || 'U').toUpperCase();

    // Аватарка отправителя
    var avatarHtml = '';
    var avatarUrl = isMe ? (S.user && S.user.avatarUrl) : m.avatar_url;
    if (avatarUrl) {
      avatarHtml = '<img src="' + escHtml(avatarUrl) + '" style="width:22px; height:22px; border-radius:50%; object-fit:cover; flex-shrink:0;" onerror="this.style.display=\'none\'">';
    } else {
      avatarHtml = '<div style="width:22px; height:22px; border-radius:50%; background:' + (isMe ? 'var(--orange)' : '#3b82f6') + '; color:#fff; display:flex; align-items:center; justify-content:center; font-size:.65rem; font-weight:700; flex-shrink:0;">' + initial + '</div>';
    }

    return `
      <div style="align-self:${align}; max-width:72%; background:${bg}; border:${border}; border-radius:10px; padding:8px 12px; box-shadow:var(--shadow)">
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px">
          ${avatarHtml}
          <span style="font-size:.72rem; font-weight:700; color:${isMe ? 'var(--orange-dark)' : 'var(--blue)'};">
            ${escHtml(senderName)}
          </span>
        </div>
        <div style="font-size:.85rem; color:var(--text); word-break:break-word; line-height:1.4">${escHtml(m.message_text)}</div>
        <div style="font-size:.65rem; color:var(--text-3); text-align:right; margin-top:4px">${time}</div>
      </div>
    `;
  }).join('');

  box.innerHTML = html;
}

function sendChatMessage() {
  var input = document.getElementById('chat_text_input');
  if (!input) return;
  var text = input.value.trim();
  if (!text || !S.activeRoomId || !S.socket) return;

  S.socket.emit('send-message', {
    roomId: S.activeRoomId,
    senderId: S.user.id,
    text: text
  });

  input.value = '';
  input.focus();
}

function scrollChatToBottom() {
  var box = document.getElementById('chat-messages');
  if (box) setTimeout(function(){ box.scrollTop = box.scrollHeight; }, 50);
}

function pageLogs() {
  var allLogs = [];
  
  // Вспомогательная функция для перевода даты "14.07.2024, 15:30:00" в миллисекунды для сортировки
  function parseRuDate(str) {
    if(!str) return 0;
    var p = str.match(/(\d{2})\.(\d{2})\.(\d{4})[^\d]+(\d{1,2}):(\d{2}):(\d{2})/);
    if(p) return new Date(p[3], p[2]-1, p[1], p[4], p[5], p[6]).getTime();
    return 0;
  }

  // Собираем историю со всех заявок
  S.tasks.forEach(function(t) {
    (t._history || []).forEach(function(h) {
      allLogs.push({
        taskId: t.id,
        addr: (t.address || '').slice(0, 40),
        date: h.date,
        author: h.author || 'Неизвестно',
        field: h.field,
        old: h.old,
        new: h.new,
        ts: parseRuDate(h.date)
      });
    });
  });

  // Сортируем: свежие события сверху
  allLogs.sort((a,b) => b.ts - a.ts);

  var rows = allLogs.slice(0, 500).map(function(l) {
    return `
      <tr style="border-bottom: 1px solid var(--border)">
        <td style="padding: 10px 12px; color:var(--text-3); font-size:.75rem; white-space:nowrap">${l.date}</td>
        <td style="padding: 10px 12px; font-weight:600">${l.author}</td>
        <td style="padding: 10px 12px">
          <button class="btn-link" onclick="openCard('${l.taskId.replace(/'/g,"\\'")}')">${l.taskId}</button>
          <div class="t3" style="font-size:.7rem; margin-top:2px">${l.addr}</div>
        </td>
        <td style="padding: 10px 12px" class="t3">${l.field}</td>
        <td style="padding: 10px 12px">
          <span style="text-decoration:line-through;color:var(--red);opacity:.7">${l.old || 'пусто'}</span> 
          &rarr; 
          <span style="color:var(--green);font-weight:600">${l.new || 'пусто'}</span>
        </td>
      </tr>
    `;
  }).join('');

  return `
    <h1 class="page-title">Журнал событий</h1>
    <div class="card tbl-wrap">
      <table style="width:100%; border-collapse:collapse; text-align:left; font-size:.85rem">
        <thead>
          <tr style="background:var(--bg)">
            <th style="padding: 10px 12px; color:var(--text-3)">Время</th>
            <th style="padding: 10px 12px; color:var(--text-3)">Пользователь</th>
            <th style="padding: 10px 12px; color:var(--text-3)">Объект</th>
            <th style="padding: 10px 12px; color:var(--text-3)">Что изменил</th>
            <th style="padding: 10px 12px; color:var(--text-3)">Значение</th>
          </tr>
        </thead>
        <tbody>${rows || '<tr><td colspan="5" style="text-align:center;padding:2rem">История пуста</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

  if (filterObj.reg !== undefined) S.taskReg = filterObj.reg;
  if (filterObj.mgr !== undefined) S.taskMgr = filterObj.mgr;
  if (filterObj.ovd !== undefined) S.taskOverdue = filterObj.ovd;
