  document.getElementById('chat-input-area').style.display = 'flex';

  // Входим в комнату на сервере по WebSocket
  if (S.socket) S.socket.emit('join-room', roomId);

  // Качаем историю сообщений
  api('/chats/' + roomId + '/messages').then(function(messages) {
    S.chatMessages = messages || [];
    renderChatMessages();
    scrollChatToBottom();
  });
}

function renderChatMessages() {
  var box = document.getElementById('chat-messages');
  if (!box) return;

  if (!S.chatMessages || !S.chatMessages.length) {
    box.innerHTML = '<div style="text-align:center; color:var(--text-3); margin-top:2rem">Нет сообщений. Напишите первым!</div>';
    return;
  }

  var currentUserId = S.user ? S.user.id : null;

  var html = S.chatMessages.map(function(m) {
    var isMe = (m.sender_id === currentUserId || (S.user && m.username === S.user.username));
    var bg = isMe ? 'var(--orange-bg)' : '#fff';
    var align = isMe ? 'flex-end' : 'flex-start';
    var border = isMe ? '1px solid #fed7aa' : '1px solid var(--border)';
    var time = new Date(m.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });

    return `
      <div style="align-self:${align}; max-width:70%; background:${bg}; border:${border}; border-radius:10px; padding:8px 12px; box-shadow:var(--shadow)">
        <div style="font-size:.7rem; font-weight:700; color:${isMe ? 'var(--orange-dark)' : 'var(--blue)'}; margin-bottom:3px">
          ${isMe ? 'Вы' : escHtml(m.full_name || m.username || 'Пользователь')}
        </div>
        <div style="font-size:.85rem; color:var(--text); word-break:break-word">${escHtml(m.message_text)}</div>
        <div style="font-size:.65rem; color:var(--text-3); text-align:right; margin-top:4px">${time}</div>
      </div>
    `;
  }).join('');

  box.innerHTML = html;
}

function sendChatMessage() {
  var input = document.getElementById('chat_text_input');
  if (!input) return;
  var text = input.value.trim();
  if (!text || !S.activeRoomId || !S.socket) return;

  var currentUserId = S.user ? (S.user.id || S.user.username) : null;

  // Отправляем по WebSocket
  S.socket.emit('send-message', {
    roomId: S.activeRoomId,
    senderId: currentUserId,
    text: text
  });

  input.value = '';
  input.focus();
}

function moveTask(id, stage) {
  var t = S.tasks.find(function(x){ return String(x.id) === String(id); });
  if (!t) return;
  
  var now = new Date().toLocaleString('ru');
  var author = S.user ? (S.user.full_name || S.user.username) : 'Система';
  var hist = t._history || [];

  var stageNames = {
    request: '1. Заявка',
    survey: '2. Обследование',
    install: '3. Монтаж',
    control: '4. Контроль',
    acceptance: '5. Приёмка',
    payment: '6. Оплата'
  };

  var oldStageName = stageNames[t.stage] || t.stage || '1. Заявка';
  var newStageName = stageNames[stage] || stage;

  if (t.stage !== stage) {
    hist.push({ date: now, author: author, field: 'Этап (Канбан)', old: oldStageName, new: newStageName });
  }

  // Авто-статус по этапу
  var newStatus = t.status;
  if (stage === 'payment') {
    newStatus = (t.status === 'paid') ? 'paid' : 'done';
  } else if (stage === 'acceptance') {
    newStatus = 'done';
  } else if (stage === 'install' || stage === 'control' || stage === 'survey') {
    if (t.status === 'pending' || !t.status) newStatus = 'progress';
  } else if (stage === 'request') {
    if (t.status === 'progress' && (!t.fact || Number(t.fact) === 0)) newStatus = 'pending';
  }

  api('/tasks/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ stage: stage, status: newStatus, _history: hist })
  })
  .then(function(){
    t.stage = stage;
    t.status = newStatus;
    t._history = hist;
    renderApp();
  })
  .catch(function(err){
    console.error('Failed to move task:', err);
    alert('Ошибка перемещения заявки: ' + (err.message || err));
  });
}

function setTaskStage(newStage) {
  if (!S.cardId) return;
  moveTask(S.cardId, newStage);
}

var contractorSearchTimeout = null;

// Обработка ввода в поисковую строку
function onContractorSearchInput(val, prefix) {
  prefix = prefix || 'nc';
  var box = document.getElementById(prefix + '_suggestions_box');
  if (!box) return;

  clearTimeout(contractorSearchTimeout);

  if (!val || val.trim().length < 3) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }

  contractorSearchTimeout = setTimeout(function() {
    api('/dadata/suggest-party?query=' + encodeURIComponent(val.trim())).then(function(list) {
      if (!list || !list.length) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      var itemsHtml = list.map(function(item) {
        var safeJson = encodeURIComponent(JSON.stringify(item));
        return `
          <div onclick="selectContractorSuggestion('${safeJson}','${prefix}')" 
               style="padding:10px 14px; border-bottom:1px solid #f4f4f5; cursor:pointer; transition:background .12s" 
               onmouseover="this.style.background='var(--orange-bg)'" 
               onmouseout="this.style.background='#fff'">
            <div style="font-weight:600; font-size:.85rem; color:var(--text)">${item.name_short}</div>
            <div style="font-size:.75rem; color:var(--text-3); margin-top:2px">
              ИНН: <strong>${item.inn || '—'}</strong> ${item.address_legal ? '· ' + item.address_legal.slice(0, 45) + '...' : ''}
            </div>
          </div>
        `;
      }).join('');
      box.innerHTML = itemsHtml;
      box.style.display = 'block';
    });
  }, 300);
}

// Выбор варианта из выпадающего списка
function selectContractorSuggestion(encodedJson, prefix) {
  prefix = prefix || 'nc';
  var data = JSON.parse(decodeURIComponent(encodedJson));
  var box = document.getElementById(prefix + '_suggestions_box');
  if (box) box.style.display = 'none';

  var searchInput = document.getElementById(prefix + '_search_input');
  if (searchInput) searchInput.value = data.name_short;

  if(data.inn) document.getElementById(prefix + '_inn').value = data.inn;
  if(data.kpp) document.getElementById(prefix + '_kpp').value = data.kpp;
  if(data.name_short) document.getElementById(prefix + '_name_short').value = data.name_short;
  if(data.name_full) document.getElementById(prefix + '_name_full').value = data.name_full;
  if(data.address_legal) document.getElementById(prefix + '_address').value = data.address_legal;
  if(data.director) document.getElementById(prefix + '_director').value = data.director;

  [prefix+'_inn', prefix+'_kpp', prefix+'_name_short', prefix+'_name_full', prefix+'_address', prefix+'_director'].forEach(function(id) {
    var el = document.getElementById(id);
    if(el && el.value) { 
      el.style.background = '#e8f5e9'; 
      setTimeout(function(){ el.style.background='#fff'; }, 1500); 
    }
  });
}

// Закрываем выпадающий список при клике в любое другое место экрана
document.addEventListener('click', function(e) {
  ['nc', 'pc'].forEach(function(prefix) {
    var box = document.getElementById(prefix + '_suggestions_box');
    if (box && !box.contains(e.target)) {
      box.style.display = 'none';
    }
  });
});

    else if (key === 'assignee' && S.user.role === 'admin') inp = '<select name="'+key+'" data-key="'+key+'">' + assigneeOpts + '</select>';
    else if (key === 'contractor' && S.user.role === 'admin') inp = '<select name="'+key+'" data-key="'+key+'" style="width:100%">' + contractorOpts + '</select>';
    else if (type === 'textarea') inp = '<textarea name="'+key+'" data-key="'+key+'">'+val+'</textarea>';
    else if (type === 'checkbox') inp = '<input type="checkbox" name="'+key+'" data-key="'+key+'"'+(val ? ' checked' : '')+'>';
    else inp = '<input type="'+(type||'text')+'" name="'+key+'" data-key="'+key+'" value="'+String(val).replace(/"/g,'&quot;')+'">';
    var dirtyMark = isDirty ? ' <span class="badge b-orange" style="font-size:10px;padding:1px 5px">изменено</span>' : '';
    return '<div class="field-row"><div class="field-lbl">'+lbl+dirtyMark+'</div><div class="field-val">'+inp+'</div></div>';
  }

  // История изменений
  var hist = (t._history || []).slice().reverse();
  var histHtml = hist.length ? hist.map(function(h){
  var authorHtml = h.author ? ' <span class="badge b-gray" style="font-size:10px;padding:1px 5px;margin-left:5px">' + h.author + '</span>' : '';
  return '<div class="hist-item">' + h.date + authorHtml + '<br><span class="t3">' + h.field + ':</span> <span style="text-decoration:line-through;color:var(--red);opacity:0.8">' + (h.old||'—') + '</span> &rarr; <b>' + (h.new||'—') + '</b></div>';
  }).join('') : '<div class="t3" style="font-size:.78rem;padding:.5rem 0">Изменений не было</div>';
  // Карта — Leaflet + Nominatim с умным геокодированием
  var mapRegion = (t.region||'').trim();
  var mapAddress = (t.address||'').trim();
  var mapFullAddr = (mapRegion ? mapRegion + ', ' : '') + mapAddress;

  // Очищаем адрес: убираем сокращения типа "с.", "ул.", "пгт" для лучшего поиска
  function cleanAddr(s) {
    return s
      .replace(/\bс\.\s*/g,'').replace(/\bпгт\.?\s*/g,'').replace(/\bул\.\s*/g,'')
      .replace(/\bд\.\s*/g,'').replace(/\bпр-кт\s*/g,'').replace(/\bпр\.\s*/g,'')
      .replace(/\bпер\.\s*/g,'').replace(/\bпос\.\s*/g,'')
      .trim();
  }

  // Строим умные варианты запросов по очереди (от точного к широкому)
  var addrParts = mapAddress.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  var lastParts = addrParts.slice(-3).join(', ');   // последние 3 части (улица, номер)
  var cityParts = addrParts.slice(-2).join(', ');   // последние 2 части

  var mapQueries = [
    // 1. Самый точный поиск: Страна + Регион + Полный адрес
    'Россия, ' + mapRegion + ', ' + cleanAddr(mapAddress),

    // 3. Запасной вариант (если в Excel регион написан с ошибкой): просто адрес
    'Россия, ' + cleanAddr(mapAddress),

    'Россия, ' + mapRegion                                           
  ].filter(function(q, i, arr){ return arr.indexOf(q) === i; });

  var mapId = 'leafmap' + Date.now();
  var dgisUrl  = 'https://2gis.ru/search/' + encodeURIComponent('Россия, ' + mapFullAddr);
  var yandexUrl = 'https://yandex.ru/maps/?text=' + encodeURIComponent('Россия, ' + mapFullAddr);

  // Кнопки карт — показываются ВСЕГДА под картой

    '</a>' +
    '<a href="' + yandexUrl + '" target="_blank" class="btn btn-sm" style="background:#fc3f1d;gap:5px">' +

      'Яндекс.Карты' +
    '</a>' +
  '</div>';

  var mapHtml = '<div id="'+mapId+'" style="height:260px;border-radius:var(--radius);overflow:hidden;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#888;font-size:.82rem">Загрузка карты…</div>' +
    mapNavBtns;

  setTimeout(function(){
    var el = document.getElementById(mapId);
    if (!el) return;

    function tryGeocode(queries, cb) {
      if (!queries.length) { cb(null); return; }
      var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ru&accept-language=ru&q=' + encodeURIComponent(queries[0]);
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d[0]) cb(d[0], queries[0]);
          else tryGeocode(queries.slice(1), cb);
        })
        .catch(function(){ tryGeocode(queries.slice(1), cb); });
    }

    function renderLeaflet() {
      if (t.geoLat && t.geoLon) {
        var lat = parseFloat(t.geoLat), lng = parseFloat(t.geoLon);

        L.marker([lat, lng]).addTo(map).bindPopup(t.cleanAddress || t.address).openPopup();
        return;
      }
      tryGeocode(mapQueries, function(result, matchedQuery) {
        if (!result) {
          // Геокодирование не удалось — показываем заглушку, кнопки уже есть под картой

    install: 'Монтажные работы на объекте. Прокладка кабельных линий, монтаж розеток и кроссового оборудования. Фиксация факта выполненных портов.',
    control: 'Контроль качества. Тестирование и прозвонка смонтированных портов, проверка чек-листа соответствия стандартам Сбера, контрольный фотоотчёт.',

      (isCurrent ? '<div style="font-size:.65rem;color:var(--orange);font-weight:700;margin-top:2px">● ТЕКУЩИЙ</div>' : '') +
      (isPassed ? '<div style="font-size:.65rem;color:var(--green);font-weight:600;margin-top:2px">✓ Пройден</div>' : '') +
    '</div>';

    if (idx < STAGE_KEYS.length - 1) {
      stepperHtml += '<div style="color:var(--text-3);font-size:1rem;user-select:none;padding:0 2px">→</div>';
    }
  });

  var lifecycleBanner = '<div class="card p mb" style="border:1.5px solid var(--border);box-shadow:var(--shadow);background:linear-gradient(135deg, #fff 0%, #fcfcfd 100%)">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;margin-bottom:.75rem">' +
      '<div>' +
        '<div style="font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--text-3)">Жизненный цикл заявки (Блок-схема регламента)</div>' +
        '<div style="display:flex;align-items:center;gap:.6rem;margin-top:2px">' +
          '<span style="font-size:1.05rem;font-weight:800">Текущий этап:</span> ' + stageBadge(curStage) +
          (t.overdueDays > 0 ? '<span class="badge b-red">Просрочка +' + t.overdueDays + ' дн</span>' : '') +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:.5rem;align-items:center">' +
        (prevStageKey ? '<button class="btn btn-sm btn-ghost" onclick="setTaskStage(\'' + prevStageKey + '\')">← ' + STAGE_NAMES[stageIdx - 1] + '</button>' : '') +
        (nextStageKey ? '<button class="btn btn-sm" onclick="setTaskStage(\'' + nextStageKey + '\')">Перевести: ' + STAGE_NAMES[stageIdx + 1] + ' →</button>' : '<span class="badge b-green" style="padding:6px 12px;font-weight:700">✅ Финал цикла</span>') +

function saveCard() {
  var t = S.tasks.find(function(x){ return String(x.id) === String(S.cardId); });
  if (!t) return;
  var data = Object.assign({}, S.cardDraft);
  if (!Object.keys(data).length) { S.cardConfirmOpen = false; renderApp(); return; }

  var now = new Date().toLocaleString('ru');
  var author = S.user ? (S.user.full_name || S.user.username) : 'Система';
  var hist = t._history || [];
  Object.keys(data).forEach(function(k){
    var oldV = t[k], newV = data[k];
    var isBool = typeof newV === 'boolean';
    var oldStr = isBool ? (!!oldV ? 'Да' : 'Нет') : String(oldV||'');
    var newStr = isBool ? (newV ? 'Да' : 'Нет') : String(newV);
    if (oldStr !== newStr) {
      hist.push({date:now, author:author, field:fieldLabels[k]||k, old:oldStr, new:newStr});
    }
  });
  data._history = hist;

  api('/tasks/' + S.cardId, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)})
    .then(function(){
      Object.assign(t, data);
      S.cardDraft = {};
      S.cardConfirmOpen = false;
      renderApp();
    })
    .catch(function(e){ alert('Ошибка сохранения: ' + e.message); });
}

function calcMarchFinance(point) {
  var km      = Number(point.km) || 0;
  var ports   = Number(point.ports) || 0;
  var ppp     = Number(point.pricePerPort) || 0;
  var rate    = Number(point.kmRate) || 70;
  var extras  = Number(point.extras) || 0;
  var tmc     = Number(point.tmc) || 0;
  var remote  = km > 0 ? Math.round(km * 2 * rate) : 0;
  var work    = Math.round(ports * ppp);
  var pay     = remote + work + extras;
  var sber    = pay + tmc;
  return { remote: remote, work: work, extras: extras, pay: pay, tmc: tmc, sber: sber };
}

function marchTotals(march) {
  var totKm = 0, totPorts = 0, totRemote = 0, totWork = 0, totExtras = 0, totPay = 0, totTmc = 0, totSber = 0;
  (march.points || []).forEach(function(p) {
    var f = calcMarchFinance(p);
    totKm      += Number(p.km) || 0;
    totPorts   += Number(p.ports) || 0;
    totRemote  += f.remote;
    totWork    += f.work;
    totExtras  += f.extras;
    totPay     += f.pay;
    totTmc     += f.tmc;
    totSber    += f.sber;
  });
  return { km: totKm, ports: totPorts, remote: totRemote, work: totWork, extras: totExtras, pay: totPay, tmc: totTmc, sber: totSber };
}

function finRow(label, val) {

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Карта маршрута ──────────────────────────────────────────────────────────
function renderMarchMap(march, mapId) {
  var el = document.getElementById(mapId);
  if (!el) return;

  var pts = march.points || [];
  if (!pts.length) return;

  function loadLeaflet(cb) {
    if (window.L) { cb(); return; }
    var css = document.createElement('link'); css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    var s = document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload = cb; document.head.appendChild(s);
  }

  function geocodeOne(query, cb) {
    fetch('/api/geocode?q=' + encodeURIComponent(query) + '&_t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){ cb(d && d[0] ? { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) } : null); })
      .catch(function(){ cb(null); });
  }

  function geocodeAll(pts, cb) {
    var results = new Array(pts.length).fill(null);
    var i = 0;

    function next() {
      if (i >= pts.length) { cb(results); return; }
      var idx = i++;
      var p   = pts[idx];
      var task = S.tasks.find(function(t){ return t.id === p.taskId; });

      // Строим запросы от точного к широкому — с регионом для однозначности
      var addr   = (p.address || '').trim();
      var region = task ? (task.region || '') : '';
      var queries = [];
      if (addr) {
        if (region) queries.push('Россия, ' + region + ', ' + addr);
        queries.push('Россия, ' + addr);
      }
      if (region) queries.push('Россия, ' + region);
      queries = queries.filter(function(q, qi, arr){ return arr.indexOf(q) === qi; });

      if (!queries.length) { setTimeout(next, 300); return; }

      function tryQuery(qi) {
        if (qi >= queries.length) { setTimeout(next, 300); return; }
        geocodeOne(queries[qi], function(coord) {
          if (coord) {
            results[idx] = coord;
            setTimeout(next, 300); // задержка между запросами — Nominatim rate limit 1 req/sec
          } else {
            tryQuery(qi + 1);
          }
        });
      }
      tryQuery(0);
    }

    next();
  }

  loadLeaflet(function() {
    el.innerHTML = '';
    el.style.display = 'block';

    // Если уже есть сохранённые координаты — используем их, иначе геокодируем
    var hasSaved = pts.every(function(p){ return p.lat && p.lng; });

    function drawMap(coords) {
      var validCoords = coords.filter(Boolean);
      if (!validCoords.length) {
        el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;text-align:center;padding:1rem">Не удалось определить координаты точек.<br>Проверьте адреса.</div>';
        return;
      }

      var map = L.map(el);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM', maxZoom: 19 }).addTo(map);

      var latLngs = [];
      var validPoints = []; // только точки с координатами

      coords.forEach(function(c, i) {
        if (!c) return;
        var p = pts[i];
        var task = S.tasks.find(function(t){ return t.id === p.taskId; });
        var addrDisplay = p.address || (task ? task.address : '') || '—';
        var ll = [c.lat, c.lng];
        latLngs.push(ll);
        validPoints.push({ ll: ll, c: c, p: p, i: i, addrDisplay: addrDisplay });

        var icon = L.divIcon({
          className: '',
          html: '<div style="background:var(--orange);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #fff">' + (i+1) + '</div>',
          iconSize: [28, 28], iconAnchor: [14, 14]
        });
        var popup = '<div style="font-size:.8rem;min-width:180px">' +
          '<div style="font-weight:700;margin-bottom:3px">' + escHtml(p.taskId || ('Точка ' + (i+1))) + '</div>' +
          '<div style="color:#666;margin-bottom:5px;font-size:.75rem">' + escHtml(addrDisplay.slice(0, 90)) + '</div>' +
          '<div style="display:flex;gap:.75rem">' +
            '<span>🛣️ <strong>' + (p.km || 0) + '</strong> км</span>' +
            '<span>🔌 <strong>' + (p.ports || 0) + '</strong> пор.</span>' +
          '</div>' +
          '<div style="color:var(--orange);font-weight:600;margin-top:4px">Оплата ПО: ' + fmtMoney(calcMarchFinance(p).pay) + '</div>' +
        '</div>';
        L.marker(ll, { icon: icon }).addTo(map).bindPopup(popup);
      });

      map.fitBounds(L.latLngBounds(latLngs), { padding: [40, 40] });

      // Сохраняем координаты чтобы не геокодировать повторно
      var updated = false;
      coords.forEach(function(c, i) {
        if (c && (!pts[i].lat || !pts[i].lng)) { pts[i].lat = c.lat; pts[i].lng = c.lng; updated = true; }
      });
      if (updated) {
        api('/marches/' + march.id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ points: pts }) });
      }

      // Маршрут по дорогам через OSRM
      if (latLngs.length < 2) return;

      // Собираем цепочку координат: база (если есть) + все точки
      function buildOsrmChain(baseLl) {
        var chain = baseLl ? [baseLl].concat(latLngs) : latLngs;
        // OSRM формат: lng,lat;lng,lat;...
        return chain.map(function(ll){ return ll[1] + ',' + ll[0]; }).join(';');
      }

      function drawRoute(coordsStr) {
        fetch('/api/route?coords=' + encodeURIComponent(coordsStr) + '&_t=' + Date.now())
          .then(function(r){ return r.json(); })
          .then(function(d) {
            if (!d.geometry) {
              // Fallback — пунктирная прямая если OSRM не ответил
              L.polyline(latLngs, { color: '#FF6200', weight: 3, opacity: 0.6, dashArray: '8 4' }).addTo(map);
              return;
            }
            // GeoJSON LineString от OSRM — координаты в формате [lng, lat]
            var routeLatLngs = d.geometry.coordinates.map(function(c){ return [c[1], c[0]]; });
            L.polyline(routeLatLngs, { color: '#FF6200', weight: 4, opacity: 0.85 }).addTo(map);
          })
          .catch(function() {
            L.polyline(latLngs, { color: '#FF6200', weight: 3, opacity: 0.6, dashArray: '8 4' }).addTo(map);
          });
      }

      if (march.baseCity && march.baseCity.trim()) {
        // Геокодируем базу и добавляем её как стартовую точку маршрута
        fetch('/api/geocode?q=' + encodeURIComponent('Россия, ' + march.baseCity) + '&_t=' + Date.now())
          .then(function(r){ return r.json(); })
          .then(function(d) {
            if (d && d[0]) {
              var baseLl = [parseFloat(d[0].lat), parseFloat(d[0].lon)];
              // Маркер базы
              var baseIcon = L.divIcon({
                className: '',
                html: '<div style="background:#2563eb;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #fff">🏠</div>',
                iconSize: [28, 28], iconAnchor: [14, 14]
              });
              L.marker(baseLl, { icon: baseIcon }).addTo(map)
                .bindPopup('<div style="font-size:.8rem"><strong>База: ' + escHtml(march.baseCity) + '</strong></div>');
              drawRoute(buildOsrmChain(baseLl));
            } else {
              drawRoute(buildOsrmChain(null));
            }
          })
          .catch(function(){ drawRoute(buildOsrmChain(null)); });
      } else {
        drawRoute(buildOsrmChain(null));
      }
    }

    if (hasSaved) {
      drawMap(pts.map(function(p){ return { lat: p.lat, lng: p.lng }; }));
    } else {
      el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;text-align:center;padding:1rem">' +
        '<div><div style="font-size:1.4rem;margin-bottom:.5rem">🔍</div>' +
        'Определяем адреса на карте…<br><span style="font-size:.75rem">~' + pts.length + ' запросов, по 1 в секунду</span></div></div>';
      geocodeAll(pts, drawMap);
    }
  });
}

function showModal(title, fields, onSave) {
  var existing = document.getElementById('_mmodal');
  if (existing) existing.remove();

  var rows = fields.map(function(f) {
    var inp;
    if (f.type === 'select') {
      inp = '<select id="mf_' + f.key + '" style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff">' +
        f.options.map(function(o){ return '<option value="' + o.value + '"' + (o.value == f.value ? ' selected' : '') + '>' + o.label + '</option>'; }).join('') +
      '</select>';
    } else if (f.type === 'textarea') {
      inp = '<textarea id="mf_' + f.key + '" rows="3" placeholder="' + escHtml(f.placeholder||'') + '" style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;resize:vertical">' + escHtml(String(f.value||'')) + '</textarea>';
    } else {
      inp = '<input id="mf_' + f.key + '" type="' + (f.type||'text') + '" value="' + escHtml(String(f.value||'')) + '" placeholder="' + escHtml(f.placeholder||'') + '" style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem">';
    }
    return '<div style="margin-bottom:.85rem">' +
      '<label style="display:block;font-size:.78rem;font-weight:700;color:var(--text-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em">' +
        f.label + (f.required ? ' <span style="color:var(--red)">*</span>' : '') +
      '</label>' + inp +
      (f.hint ? '<div style="font-size:.72rem;color:var(--text-3);margin-top:4px">' + f.hint + '</div>' : '') +
      (f.hintId ? '<div id="' + f.hintId + '" style="font-size:.72rem;color:var(--orange);margin-top:4px"></div>' : '') +
    '</div>';
  }).join('');

  var modal = document.createElement('div');
  modal.id = '_mmodal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(2px)';
  modal.innerHTML =
    '<div style="background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:480px;box-shadow:0 12px 48px rgba(0,0,0,.22);max-height:90vh;overflow-y:auto">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">' +
        '<div style="font-weight:700;font-size:1.05rem">' + title + '</div>' +
        '<button onclick="document.getElementById(\'_mmodal\').remove()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--text-3);line-height:1;padding:0 4px">×</button>' +
      '</div>' +
      rows +
      '<div style="display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.25rem">' +
        '<button onclick="document.getElementById(\'_mmodal\').remove()" class="btn btn-ghost btn-sm">Отмена</button>' +
        '<button id="_msave" class="btn btn-sm">Сохранить</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(modal);
  modal.addEventListener('click', function(e){ if (e.target === modal) modal.remove(); });

  // Навешиваем onInput колбеки если заданы в полях
  fields.forEach(function(f) {
    if (!f.onInput) return;
    var el = document.getElementById('mf_' + f.key);
    if (el) el.addEventListener('input', function() { f.onInput(el.value); });
  });

  document.getElementById('_msave').onclick = function() {
    var data = {};
    var ok = true;
    fields.forEach(function(f) {
      var el = document.getElementById('mf_' + f.key);
      if (!el) return;
      data[f.key] = el.value.trim !== undefined ? el.value.trim() : el.value;
      if (f.required && !data[f.key]) {
        el.style.borderColor = 'var(--red)';
        el.focus();
        ok = false;
      }
    });
    if (!ok) return;
    modal.remove();
    onSave(data);
  };

  modal.addEventListener('keydown', function(e){
    if (e.key === 'Escape') modal.remove();
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
      var btn = document.getElementById('_msave');
      if (btn) btn.click();
    }
  });

  setTimeout(function(){
    var el = document.getElementById('mf_' + fields[0].key);
    if (el) { el.focus(); if (el.select) el.select(); }
  }, 60);
}

// Диалог подтверждения вместо confirm()
function showConfirm(msg, onYes) {
  var existing = document.getElementById('_mmodal');
  if (existing) existing.remove();

  var modal = document.createElement('div');
  modal.id = '_mmodal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(2px)';
  modal.innerHTML =
    '<div style="background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:360px;box-shadow:0 12px 48px rgba(0,0,0,.22)">' +
      '<div style="font-size:1rem;margin-bottom:1.25rem;line-height:1.5">' + msg + '</div>' +
      '<div style="display:flex;gap:.6rem;justify-content:flex-end">' +
        '<button onclick="document.getElementById(\'_mmodal\').remove()" class="btn btn-ghost btn-sm">Отмена</button>' +
        '<button id="_myes" class="btn btn-sm" style="background:var(--red);border-color:var(--red)">Удалить</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
  modal.addEventListener('click', function(e){ if (e.target === modal) modal.remove(); });
  modal.addEventListener('keydown', function(e){ if (e.key === 'Escape') modal.remove(); });
  document.getElementById('_myes').onclick = function() { modal.remove(); onYes(); };
  setTimeout(function(){ var b = document.getElementById('_myes'); if(b) b.focus(); }, 60);
}

function openAddPoint(marchId) {
  var march = S.marches.find(function(m){ return m.id === marchId; });
  if (!march) return;

  function autofillFromTask(taskId) {
    var task = S.tasks.find(function(t){ return t.id === taskId.trim(); });
    if (!task) return;

    var addrEl  = document.getElementById('mf_address');
    var portsEl = document.getElementById('mf_ports');
    var pppEl   = document.getElementById('mf_pricePerPort');
    var ctrEl   = document.getElementById('mf_contractor');
    var kmEl    = document.getElementById('mf_km');

    if (addrEl  && !addrEl.value)  addrEl.value  = task.address || '';
    if (portsEl && !portsEl.value) {
      var p = task.fact || task.inOrder || 0;
      portsEl.value = p;
      if (pppEl) pppEl.value = p >= 3 ? 3750 : p === 2 ? 4250 : 5000;
    }
    if (ctrEl && !ctrEl.value) ctrEl.value = task.assignee || task.contractor || '';

    // Подсветка
    [addrEl, portsEl, pppEl, ctrEl].forEach(function(el) {
      if (el) { el.style.background = '#fffbe6'; setTimeout(function(){ el.style.background = ''; }, 1200); }
    });

    // Авторасстояние через OSRM если задан базовый город
    if (!march.baseCity || !march.baseCity.trim()) return;
    if (kmEl) { kmEl.disabled = true; }
    var kmStatus = document.getElementById('mf_km_status');
    if (kmStatus) kmStatus.textContent = 'считаем…';

    // Геокодируем базу и адрес, потом считаем маршрут через OSRM
    var baseQ = 'Россия, ' + march.baseCity;
    var rawAddr = (task.address || '').trim();

    // Очищаем адрес: убираем сокращения, этажи, офисы — они мешают Nominatim
    function cleanForGeo(s) {
      return s
        .replace(/\bрп\b/gi, 'посёлок')
        .replace(/\bпгт\b/gi, 'посёлок')
        .replace(/\bс\./gi, '')
        .replace(/\bд\./gi, '')
        .replace(/\bул\./gi, 'улица')
        .replace(/\bпр-кт\b/gi, 'проспект')
        .replace(/,?\s*\d+-й\s+этаж.*$/i, '')   // убираем этаж и всё после
        .replace(/,?\s*оф\.?\s*\d+.*$/i, '')    // убираем офис
        .replace(/,?\s*кв\.?\s*\d+.*$/i, '')    // убираем квартиру
        .replace(/\s+/g, ' ').trim();
    }

    // Несколько вариантов запроса — от точного к упрощённому
    function tryGeocode(queries) {
      if (!queries.length) return Promise.resolve(null);
      var q = queries[0];
      return fetch('/api/geocode?q=' + encodeURIComponent(q) + '&_t=' + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d[0]) {
            console.log('[march] geocode OK:', q, '->', d[0].display_name);
            return d[0];
          }
          console.log('[march] geocode miss:', q);
          return tryGeocode(queries.slice(1));
        });
    }

    var cleaned = cleanForGeo(rawAddr);
    // Берём только улицу+номер дома (последние 2 части через запятую)
    var parts   = cleaned.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var short   = parts.slice(-2).join(', ');
    var addrVariants = [
      'Россия, ' + cleaned,
      'Россия, ' + rawAddr,
      short ? 'Россия, ' + short : null,
      parts[0] ? 'Россия, ' + parts[0] : null,
    ].filter(Boolean);

    Promise.all([
      tryGeocode(['Россия, ' + march.baseCity]),
      tryGeocode(addrVariants)
    ]).then(function(results) {
      var base = results[0];
      var dest = results[1];
      if (!base || !dest) {
        if (kmEl) kmEl.disabled = false;
        if (kmStatus) kmStatus.textContent = '⚠ ' + (!base ? 'база не найдена' : 'адрес не найден — введите км вручную');
        return;
      }
      var coords = base.lon + ',' + base.lat + ';' + dest.lon + ',' + dest.lat;
      return fetch('/api/route?coords=' + encodeURIComponent(coords) + '&_t=' + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(d) {
          if (kmEl) {
            kmEl.disabled = false;
            if (d && d.distance_km) {
              kmEl.value = d.distance_km;
              kmEl.style.background = '#e8f5e9';
              setTimeout(function(){ kmEl.style.background = ''; }, 1500);
              if (kmStatus) kmStatus.textContent = '✓ ' + d.distance_km + ' км (' + (d.duration_min || '?') + ' мин)';
            } else {
              if (kmStatus) kmStatus.textContent = '⚠ маршрут не найден — введите км вручную';
            }
          }
        });
    }).catch(function(e) {
      if (kmEl) kmEl.disabled = false;
      if (kmStatus) kmStatus.textContent = 'ошибка соединения — введите км вручную';
      console.error('[march] geocode error:', e);
    });
  }

  showModal('➕ Добавить точку', [
    { key: 'taskId',       label: 'ID заявки', placeholder: 'ББ-5376-03 (необязательно)', hint: 'Введите ID — адрес, порты и подрядчик подтянутся автоматически', onInput: autofillFromTask },
    { key: 'address',      label: 'Адрес объекта', placeholder: 'г. Шилка, ул. Ленина, 5', required: true },
    { key: 'km',           label: 'Расстояние от базы (км)', type: 'number', value: '', hint: '', hintId: 'mf_km_status' },
    { key: 'ports',        label: 'Кол-во портов', type: 'number', value: '' },
    { key: 'pricePerPort', label: 'Цена за порт (₽)', type: 'number', value: 3750, hint: 'Авто: ≥3 пор. → 3750, 2 → 4250, 1 → 5000' },
    { key: 'extras',       label: 'Допы (₽)', type: 'number', value: 0 },
    { key: 'tmc',          label: 'ТМЦ — материалы (₽)', type: 'number', value: 0 },
    { key: 'contractor',   label: 'Подрядчик', placeholder: 'Необязательно' },
  ], function(d) {
    var taskId = (d.taskId || '').trim();
    var task   = taskId ? S.tasks.find(function(t){ return t.id === taskId; }) : null;
    var ports  = parseInt(d.ports) || (task ? (task.fact || task.inOrder || 0) : 0);
    var ppp    = parseFloat(d.pricePerPort) || (ports >= 3 ? 3750 : ports === 2 ? 4250 : 5000);

    var point = {
      taskId:       taskId || null,
      address:      d.address || (task ? task.address : ''),
      km:           parseFloat(d.km) || 0,
      ports:        ports,
      pricePerPort: ppp,
      kmRate:       march.kmRate || 70,
      extras:       parseFloat(d.extras) || 0,
      tmc:          parseFloat(d.tmc) || 0,
      contractor:   d.contractor || (task ? (task.assignee || task.contractor || '') : ''),
      lat: null, lng: null
    };

    var pts = (march.points || []).slice();
    pts.push(point);
    api('/marches/' + marchId, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ points: pts }) })
      .then(function() { march.points = pts; renderApp(); })
      .catch(function(e){ alert('Ошибка: ' + e.message); });
  });
}

function editPoint(marchId, idx) {
  var march = S.marches.find(function(m){ return m.id === marchId; });
  if (!march) return;
  var pts = (march.points || []).slice();
  var p = pts[idx];
  if (!p) return;

  showModal('✏️ Редактировать точку', [
    { key: 'address',      label: 'Адрес', value: p.address || '', required: true },
    { key: 'km',           label: 'Км от базы', type: 'number', value: p.km || 0 },
    { key: 'ports',        label: 'Портов', type: 'number', value: p.ports || 0 },
    { key: 'pricePerPort', label: 'Цена за порт (₽)', type: 'number', value: p.pricePerPort || 3750 },
    { key: 'extras',       label: 'Допы (₽)', type: 'number', value: p.extras || 0 },
    { key: 'tmc',          label: 'ТМЦ (₽)', type: 'number', value: p.tmc || 0 },
    { key: 'contractor',   label: 'Подрядчик', value: p.contractor || '' },
  ], function(d) {
    pts[idx] = Object.assign({}, p, {
      address: d.address, km: parseFloat(d.km)||0, ports: parseInt(d.ports)||0,
      pricePerPort: parseFloat(d.pricePerPort)||3750,
      extras: parseFloat(d.extras)||0, tmc: parseFloat(d.tmc)||0,
      contractor: d.contractor, lat: null, lng: null
    });
    api('/marches/' + marchId, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ points: pts }) })
      .then(function() { march.points = pts; renderApp(); });
  });
}

function toggleContractorBreakdown() {
  var el = document.getElementById('contractorBreakdown');
  var btn = document.getElementById('ctrToggleBtn');
  if (!el) return;
  var hidden = el.style.display === 'none';
  el.style.display = hidden ? 'block' : 'none';
  if (btn) btn.textContent = hidden ? 'Скрыть разбивку ▴' : 'По подрядчикам ▾';
}

function deletePoint(marchId, idx) {
  showConfirm('Удалить эту точку из маршрута?', function() {
    var march = S.marches.find(function(m){ return m.id === marchId; });
    if (!march) return;
    var pts = (march.points || []).slice();
    pts.splice(idx, 1);
    api('/marches/' + marchId, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ points: pts }) })
      .then(function() { march.points = pts; renderApp(); });
  });
}

init();
</script>
</body>
