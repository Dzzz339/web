<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1280" width="1040" height="1280" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-4%" y="-2%" width="108%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Заголовок схемы -->
  <rect x="20" y="20" width="1000" height="70" rx="12" fill="#0f172a" filter="url(#shadow)"/>
  <text x="50" y="52" fill="#ffffff" font-size="20" font-weight="800">StockEasy — Сквозная архитектурная схема движения данных</text>
  <text x="50" y="74" fill="#94a3b8" font-size="13" font-weight="500">От входящих Excel-реестров Заказчика до генерации документов .docx и финансового баланса</text>

  <!-- ========================================== -->
  <!-- БЛОК 1: ВХОДЯЩИЕ ИСТОЧНИКИ ДАННЫХ -->
  <!-- ========================================== -->
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="1000" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="-12" width="280" height="26" rx="6" fill="#2563eb"/>
    <text x="26" y="5" fill="#ffffff" font-size="12" font-weight="700">1. ВХОДЯЩИЕ ПОТОКИ (ИСТОЧНИКИ)</text>

    <!-- Карточка 1.1 -->
    <rect x="20" y="24" width="300" height="106" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="35" y="48" fill="#1e3a8a" font-size="13" font-weight="700">📊 Excel-реестры Заказчика</text>
    <text x="35" y="68" fill="#334155" font-size="12">• ПАО Сбербанк, ОСФР, РПН</text>
    <text x="35" y="86" fill="#334155" font-size="12">• Загрузка: /api/excel/import-rows</text>
    <text x="35" y="104" fill="#0369a1" font-size="11" font-weight="600">➔ cleanData() &amp; safeDate()</text>

    <!-- Карточка 1.2 -->
    <rect x="350" y="24" width="300" height="106" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="365" y="48" fill="#1e3a8a" font-size="13" font-weight="700">📍 DaData &amp; Геокодинг</text>
    <text x="365" y="68" fill="#334155" font-size="12">• Нормализация адреса по ФИАС</text>
    <text x="365" y="86" fill="#334155" font-size="12">• Координаты: geo_lat, geo_lon</text>
    <text x="365" y="104" fill="#0369a1" font-size="11" font-weight="600">➔ Расчёт distance_km от базы</text>

    <!-- Карточка 1.3 -->
    <rect x="680" y="24" width="300" height="106" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="695" y="48" fill="#1e3a8a" font-size="13" font-weight="700">📑 Реестр контрактов и ДС</text>
    <text x="695" y="68" fill="#334155" font-size="12">• Справочник contracts &amp; ДС</text>
    <text x="695" y="86" fill="#334155" font-size="12">• Авто-привязка по префиксу '0926-02'</text>
    <text x="695" y="104" fill="#0369a1" font-size="11" font-weight="600">➔ contract_id, own_company_id</text>
  </g>

  <!-- Стрелка 1 -> 2 -->
  <line x1="520" y1="260" x2="520" y2="285" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ========================================== -->
  <!-- БЛОК 2: ЦЕНТРАЛЬНАЯ БАЗА ДАННЫХ -->
  <!-- ========================================== -->
  <g transform="translate(20, 290)">
    <rect x="0" y="0" width="1000" height="150" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="-12" width="280" height="26" rx="6" fill="#7c3aed"/>
    <text x="26" y="5" fill="#ffffff" font-size="12" font-weight="700">2. ЦЕНТРАЛЬНАЯ БАЗА POSTGRESQL</text>

    <!-- Таблица tasks -->
    <rect x="20" y="24" width="300" height="106" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="35" y="48" fill="#4c1d95" font-size="13" font-weight="700">🗄️ Таблица tasks (Ядро)</text>
    <text x="35" y="68" fill="#334155" font-size="12">• id, address, vsp, gosb, deadline</text>
    <text x="35" y="86" fill="#334155" font-size="12">• amount (выручка Заказчика)</text>
    <text x="35" y="104" fill="#6d28d9" font-size="11" font-weight="600">• in_order, fact, distance_km</text>

    <!-- Таблица task_subcontracts -->
    <rect x="350" y="24" width="300" height="106" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="365" y="48" fill="#4c1d95" font-size="13" font-weight="700">🤝 task_subcontracts</text>
    <text x="365" y="68" fill="#334155" font-size="12">• contractor_id, specialist_id</text>
    <text x="365" y="86" fill="#334155" font-size="12">• price_agreed (к выплате монтажнику)</text>
    <text x="365" y="104" fill="#6d28d9" font-size="11" font-weight="600">• calculation_details (JSON сметы)</text>

    <!-- Таблица task_documents -->
    <rect x="680" y="24" width="300" height="106" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="695" y="48" fill="#4c1d95" font-size="13" font-weight="700">📂 task_documents</text>
    <text x="695" y="68" fill="#334155" font-size="12">• doc_type, doc_number, doc_date</text>
    <text x="695" y="86" fill="#334155" font-size="12">• file_url (/uploads/documents/*.docx)</text>
    <text x="695" y="104" fill="#6d28d9" font-size="11" font-weight="600">• meta (снимок параметров для аудита)</text>
  </g>

  <!-- Стрелка 2 -> 3 -->
  <line x1="520" y1="440" x2="520" y2="465" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ========================================== -->
  <!-- БЛОК 3: ВХОДНОЙ КОНТРОЛЬ И РАСЧЕТ СМЕТЫ -->
  <!-- ========================================== -->
  <g transform="translate(20, 470)">
    <rect x="0" y="0" width="1000" height="160" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="-12" width="310" height="26" rx="6" fill="#d97706"/>
    <text x="26" y="5" fill="#ffffff" font-size="12" font-weight="700">3. ВХОДНОЙ КОНТРОЛЬ И СМЕТА СМР (PM)</text>

    <!-- Контроль ПМ -->
    <rect x="20" y="24" width="460" height="116" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="35" y="48" fill="#92400e" font-size="13" font-weight="700">🚦 Gate 1: Проверка и утверждение ПМ</text>
    <text x="35" y="70" fill="#334155" font-size="12">• Проверка наличия ссылки на Яндекс.Диск с ТЗ (tech_link)</text>
    <text x="35" y="90" fill="#334155" font-size="12">• Сверка адреса, номеров ВСП/ГОСБ и объема портов</text>
    <text x="35" y="112" fill="#b45309" font-size="12" font-weight="700">➔ assignment_status = 'accepted' (разблокирует назначение)</text>

    <!-- Калькулятор СМР -->
    <rect x="500" y="24" width="480" height="116" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="515" y="48" fill="#92400e" font-size="13" font-weight="700">🧮 Алгоритм расчёта стоимости СМР (Wizard)</text>
    <text x="515" y="68" fill="#334155" font-size="12">• Порты: до 3 портов = 3000 ₽/порт, свыше 3 = 2500 ₽/порт</text>
    <text x="515" y="86" fill="#334155" font-size="12">• Шкафы ТКШ: 18U (6.5к) | 32U (8к) | 42U (10к) | Замена (10к)</text>
    <text x="515" y="104" fill="#334155" font-size="12">• Выезд свыше 10 км: (км − 10) × 12 ₽/км</text>
    <text x="515" y="122" fill="#b45309" font-size="11" font-weight="700">• Доп. расходы: бурение (22к), гостиница, спецтехника</text>
  </g>

  <!-- Стрелка 3 -> 4 -->
  <line x1="520" y1="630" x2="520" y2="655" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ========================================== -->
  <!-- БЛОК 4: ПРОИЗВОДСТВЕННЫЙ КОНТУР -->
  <!-- ========================================== -->
  <g transform="translate(20, 660)">
    <rect x="0" y="0" width="1000" height="140" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="-12" width="340" height="26" rx="6" fill="#059669"/>
    <text x="26" y="5" fill="#ffffff" font-size="12" font-weight="700">4. ПРОИЗВОДСТВО (ПАРАЛЛЕЛЬНЫЕ ТРЕКИ)</text>

    <!-- Трек СМР -->
    <rect x="20" y="24" width="300" height="96" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="35" y="48" fill="#065f46" font-size="13" font-weight="700">🛠️ Трек СМР на объекте</text>
    <text x="35" y="68" fill="#334155" font-size="12">• Выезд монтажников по пропуску</text>
    <text x="35" y="86" fill="#334155" font-size="12">• Фотоотчет узлов и скрытых работ</text>
    <text x="35" y="104" fill="#047857" font-size="11" font-weight="600">➔ Заполнение кабельного журнала</text>

    <!-- Трек Снабжения -->
    <rect x="350" y="24" width="300" height="96" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="365" y="48" fill="#065f46" font-size="13" font-weight="700">📦 Трек Снабжения (ТМЦ)</text>
    <text x="365" y="68" fill="#334155" font-size="12">• Квантование бухт кабеля (305м)</text>
    <text x="365" y="86" fill="#334155" font-size="12">• Доверенность М-2 монтажнику</text>
    <text x="365" y="104" fill="#047857" font-size="11" font-weight="600">➔ Накладная М-15 на выдачу со склада</text>

    <!-- Трек ИД -->
    <rect x="680" y="24" width="300" height="96" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="695" y="48" fill="#065f46" font-size="13" font-weight="700">📐 Трек Контроля ИД</text>
    <text x="695" y="68" fill="#334155" font-size="12">• 10 этапов жизненного цикла</text>
    <text x="695" y="86" fill="#334155" font-size="12">• Схемы DWG/PDF, Fluke Cat.5e</text>
    <text x="695" y="104" fill="#047857" font-size="11" font-weight="600">➔ Сдача комплекта куратору Сбера</text>
  </g>

  <!-- Стрелка 4 -> 5 -->
  <line x1="520" y1="800" x2="520" y2="825" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ========================================== -->
  <!-- БЛОК 5: ВЫХОДНЫЕ ДОКУМЕНТЫ (.DOCX) -->
  <!-- ========================================== -->
  <g transform="translate(20, 830)">
    <rect x="0" y="0" width="1000" height="175" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="16" y="-12" width="330" height="26" rx="6" fill="#4f46e5"/>
    <text x="26" y="5" fill="#ffffff" font-size="12" font-weight="700">5. ДОКУМЕНТООБОРОТ (docxGenerator.js)</text>

    <!-- Документ 1 -->
    <rect x="20" y="24" width="225" height="60" rx="6" fill="#ffffff" stroke="#818cf8"/>
    <text x="32" y="45" fill="#1e1b4b" font-size="11" font-weight="700">📄 Приложение №2</text>
    <text x="32" y="62" fill="#475569" font-size="10">Заказ-наряд на СМР</text>

    <!-- Документ 2 -->
    <rect x="265" y="24" width="225" height="60" rx="6" fill="#ffffff" stroke="#818cf8"/>
    <text x="277" y="45" fill="#1e1b4b" font-size="11" font-weight="700">📑 Договор подряда</text>
    <text x="277" y="62" fill="#475569" font-size="10">Рамочный договор с монтажником</text>

    <!-- Документ 3 -->
    <rect x="510" y="24" width="225" height="60" rx="6" fill="#ffffff" stroke="#818cf8"/>
    <text x="522" y="45" fill="#1e1b4b" font-size="11" font-weight="700">✅ Акт сдачи (КС-2)</text>
    <text x="522" y="62" fill="#475569" font-size="10">Сдача-приемка работ</text>

    <!-- Документ 4 -->
    <rect x="755" y="24" width="225" height="60" rx="6" fill="#ffffff" stroke="#818cf8"/>
    <text x="767" y="45" fill="#1e1b4b" font-size="11" font-weight="700">💰 Счет на оплату</text>
    <text x="767" y="62" fill="#475569" font-size="10">Реквизиты исполнителя</text>

    <!-- Документ 5 -->
    <rect x="20" y="96" width="225" height="60" rx="6" fill="#ffffff" stroke="#818cf8"/>
    <text x="32" y="117" fill="#1e1b4b" font-size="11" font-weight="700">🪪 Письмо на допуск</text>
    <text x="32" y="134" fill="#475569" font-size="10">Пропуск СБ Сбербанка</text>

    <!-- Документ 6 -->
    <rect x="265" y="96" width="225" height="60" rx="6" fill="#ffffff" stroke="#818cf8"/>
    <text x="277" y="117" fill="#1e1b4b" font-size="11" font-weight="700">📜 Доверенность М-2</text>
    <text x="277" y="134" fill="#475569" font-size="10">Получение ТМЦ у поставщика</text>

    <!-- Документ 7 -->
    <rect x="510" y="96" width="225" height="60" rx="6" fill="#ffffff" stroke="#818cf8"/>
    <text x="522" y="117" fill="#1e1b4b" font-size="11" font-weight="700">📋 Реестр ИД</text>
    <text x="522" y="134" fill="#475569" font-size="10">Передача схем и протоколов</text>

    <!-- Документ 8 -->
    <rect x="755" y="96" width="225" height="60" rx="6" fill="#ffffff" stroke="#818cf8"/>
    <text x="767" y="117" fill="#1e1b4b" font-size="11" font-weight="700">📦 Накладная М-15</text>
    <text x="767" y="134" fill="#475569" font-size="10">Выдача материалов монтажнику</text>
  </g>

  <!-- Стрелка 5 -> 6 -->
  <line x1="520" y1="1005" x2="520" y2="1030" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- ========================================== -->
  <!-- БЛОК 6: ФИНАНСОВЫЙ БАЛАНС ОБЪЕКТА -->
  <!-- ========================================== -->
  <g transform="translate(20, 1035)">
    <rect x="0" y="0" width="1000" height="175" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
    <rect x="16" y="-12" width="310" height="26" rx="6" fill="#16a34a"/>
    <text x="26" y="5" fill="#ffffff" font-size="12" font-weight="700">6. СКВОЗНОЙ ФИНАНСОВЫЙ БАЛАНС</text>

    <!-- Входящая выручка -->
    <rect x="20" y="24" width="240" height="125" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="35" y="52" fill="#15803d" font-size="14" font-weight="800">➕ ВХОДЯЩИЙ ДОХОД</text>
    <text x="35" y="74" fill="#0f172a" font-size="13" font-weight="700">tasks.amount</text>
    <text x="35" y="94" fill="#475569" font-size="11">Выручка по договору</text>
    <text x="35" y="110" fill="#475569" font-size="11">Заказчика (Сбер / ОСФР)</text>
    <text x="35" y="130" fill="#15803d" font-size="11" font-weight="700">Пример: 50 000 ₽</text>

    <!-- Минус Расходы -->
    <text x="278" y="90" fill="#dc2626" font-size="28" font-weight="900">➖</text>

    <rect x="315" y="24" width="380" height="125" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
    <text x="330" y="52" fill="#b91c1c" font-size="14" font-weight="800">ПРЯМЫЕ ЗАТРАТЫ ОБЪЕКТА</text>
    <text x="330" y="74" fill="#334155" font-size="12">1. СМР Подрядчика: порты + шкафы + км (в смете)</text>
    <text x="330" y="94" fill="#334155" font-size="12">2. Доп. расходы: бурение (22к), вышка (15к), ГСМ</text>
    <text x="330" y="114" fill="#334155" font-size="12">3. Себестоимость ТМЦ: кабель, розетки (tasks.tmc)</text>
    <text x="330" y="134" fill="#b91c1c" font-size="11" font-weight="700">Пример затрат: 18 540 ₽ + 15 000 ₽ = 33 540 ₽</text>

    <!-- Равно Маржа -->
    <text x="713" y="90" fill="#16a34a" font-size="28" font-weight="900">🟰</text>

    <rect x="750" y="24" width="230" height="125" rx="8" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <text x="765" y="52" fill="#ffffff" font-size="14" font-weight="800">💎 ОПЕРАЦИОННАЯ МАРЖА</text>
    <text x="765" y="78" fill="#ffffff" font-size="15" font-weight="800">Остаток Генподрядчика</text>
    <text x="765" y="102" fill="#bbf7d0" font-size="12">Пример: 16 460 ₽ (33%)</text>
    <text x="765" y="128" fill="#ffffff" font-size="11" font-weight="600">Маржа = Доход − Затраты</text>
  </g>
</svg>
